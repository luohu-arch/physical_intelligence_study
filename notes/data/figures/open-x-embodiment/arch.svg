<text x="20" y="81" font-size="14" font-weight="700" fill="#1f2328">open-x-embodiment</text>
<text x="565" y="81" font-size="12" fill="#57606a" text-anchor="end">OXE 把全球 21 个机构的 60 个数据集统一成 RLDS 格式，拼出 100 万+ 真机轨迹、22 种机器人形态、527 种技能（160266 任务实例）的数据底座，并用</text>
