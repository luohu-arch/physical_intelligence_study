<text x="478.0" y="726.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">编码多模态操作风格</text>
<rect x="352" y="887" width="246" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="352" y1="893" x2="352" y2="986" stroke="#1a7f37" stroke-width="3"/>
