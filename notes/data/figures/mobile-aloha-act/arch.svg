<text x="620.0" y="572.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">协同训练 复用视觉-动作表征</text>
<text x="551.2" y="1045.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">重构 + KL(beta=10) ELBO 损失</text>
<text x="391.5" y="1300.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">块间 temporal ensemble 重叠…</text>
<text x="452.2" y="765.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">新观测闭环修正 无 SLAM 纠偏 ~10cm</text>
