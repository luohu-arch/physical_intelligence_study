<text x="144.0" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">每任务仅 50 条</text>
<rect x="633" y="168" width="264" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="633" y1="174" x2="633" y2="267" stroke="#0969da" stroke-width="3"/>
<text x="765.0" y="213.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">静态 ALOHA 数据</text>
<text x="765.0" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">2.7K&lt;br/</text>
<rect x="345" y="395" width="259" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="345" y1="401" x2="345" y2="527" stroke="#1a7f37" stroke-width="3"/>
<text x="474.5" y="444.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">CVAE 编码器 q(z|x,y)</text>
<text x="474.5" y="465.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">ResNet18 + 4 层</text>
<text x="474.5" y="494.25" font-size="12.5" fill="#57606a" text-anchor="middle">Transformer</text>
<rect x="370" y="660" width="216" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="370" y1="666" x2="370" y2="759" stroke="#1a7f37" stroke-width="3"/>
