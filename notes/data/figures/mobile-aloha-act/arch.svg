<text x="505.8" y="938.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">重构 + KL(beta=10) ELBO 损失</text>
<text x="363.0" y="1166.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">块间 temporal ensemble 重叠…</text>
<text x="417.8" y="682.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">新观测闭环修正 无 SLAM 纠偏 ~10cm</text>
