<rect x="300" y="168" width="259" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="300" y1="174" x2="300" y2="267" stroke="#0969da" stroke-width="3"/>
<text x="429.5" y="213.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">当前观测 x</text>
<text x="429.5" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">3 路 RGB 480x640@50Hz</text>
<rect x="52" y="168" width="184" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
