<svg xmlns="http://www.w3.org/2000/svg" width="927" height="1529" viewBox="-4 59 927 1529" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>mobile-aloha-act</title>
<rect x="-4" y="59" width="927" height="1529" fill="#ffffff"/>
<text x="18" y="89" font-size="14" font-weight="700" fill="#1f2328">mobile-aloha-act</text>
<text x="901" y="89" font-size="12" fill="#57606a" text-anchor="end">Mobile ALOHA 与 ACT 提供了低成本全身遥操作硬件方案与动作分块（Action Chunking）Transformer 架构，通过 CVAE 建模多模态示教分布</text>
