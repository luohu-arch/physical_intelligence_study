<text x="437.5" y="425.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">ResNet18 + 4 层</text>
<text x="437.5" y="445.5" font-size="11.5" fill="#57606a" text-anchor="middle">Transformer</text>
