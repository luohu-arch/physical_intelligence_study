<text x="438.0" y="654.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">编码多模态操作风格</text>
<rect x="314" y="792" width="246" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="314" y1="798" x2="314" y2="891" stroke="#1a7f37" stroke-width="3"/>
<text x="437.0" y="839.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">CVAE 解码器 p(y|x,z)</text>
<text x="437.0" y="857.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">7 层 Transformer</text>
<rect x="444" y="995" width="261" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="444" y1="1001" x2="444" y2="1127" stroke="#8a5a00" stroke-width="3"/>
<text x="574.5" y="1049.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">ELBO</text>
<text x="574.5" y="1067.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">抑制复合误差 O(T^2 eps</text>
<text x="574.5" y="1087.5" font-size="11.5" fill="#57606a" text-anchor="middle">)</text>
<rect x="170" y="1012" width="236" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="170" y1="1018" x2="170" y2="1111" stroke="#0b57d0" stroke-width="3"/>
<text x="288.0" y="1059.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">动作块 Action Chunk</text>
<text x="288.0" y="1077.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">一次预测 K=45 步</text>
<rect x="306" y="1231" width="264" height="155" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="306" y1="1237" x2="306" y2="1380" stroke="#8250df" stroke-width="3"/>
<text x="438.0" y="1286.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行</text>
<text x="438.0" y="1304.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">双臂位置控制 + 底座速度</text>
<text x="438.0" y="1324.5" font-size="11.5" fill="#57606a" text-anchor="middle">控制</text>
<text x="438.0" y="1339.5" font-size="11.5" fill="#57606a" text-anchor="middle">延迟 d 步错位补偿</text>
