<text x="475.0" y="953.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">7 层 Transformer</text>
<rect x="497" y="1114" width="261" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="497" y1="1120" x2="497" y2="1246" stroke="#8a5a00" stroke-width="3"/>
<text x="627.5" y="1163.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">ELBO</text>
<text x="627.5" y="1184.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">抑制复合误差 O(T^2 eps</text>
<text x="627.5" y="1213.25" font-size="12.5" fill="#57606a" text-anchor="middle">)</text>
<rect x="190" y="1133" width="236" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="190" y1="1139" x2="190" y2="1232" stroke="#0b57d0" stroke-width="3"/>
<text x="308.0" y="1178.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">动作块 Action Chunk</text>
<text x="308.0" y="1199.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">一次预测 K=45 步</text>
<rect x="343" y="1379" width="264" height="155" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="343" y1="1385" x2="343" y2="1528" stroke="#8250df" stroke-width="3"/>
<text x="475.0" y="1428.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行</text>
<text x="475.0" y="1449.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">双臂位置控制 + 底座速度</text>
<text x="475.0" y="1478.0" font-size="12.5" fill="#57606a" text-anchor="middle">控制</text>
<text x="475.0" y="1495.5" font-size="12.5" fill="#57606a" text-anchor="middle">延迟 d 步错位补偿</text>
<text x="476.2" y="588.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">风格采样</text>
