<svg xmlns="http://www.w3.org/2000/svg" width="879" height="1383" viewBox="-2 51 879 1383" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>mobile-aloha-act</title>
<rect x="-2" y="51" width="879" height="1383" fill="#ffffff"/>
<text x="20" y="81" font-size="14" font-weight="700" fill="#1f2328">mobile-aloha-act</text>
<text x="855" y="81" font-size="12" fill="#57606a" text-anchor="end">Mobile ALOHA 与 ACT 提供了低成本全身遥操作硬件方案与动作分块（Action Chunking）Transformer 架构，通过 CVAE 建模多模态示教分布</text>
