<text x="882" y="70" font-size="12" fill="#57606a" text-anchor="end">RoboCat 是一个基于 Gato 架构的视觉目标条件决策 Transformer，首次实现了跨多机器人本体的大规模多任务操作，并通过「从实践中自我生成数据 -&gt; 重训练」的</text>
