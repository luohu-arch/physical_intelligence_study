<text x="52" y="52" font-size="25" font-weight="800" fill="#1a2733">robocat</text>
<text x="52" y="74" font-size="13.5" fill="#78909c">RoboCat 是一个基于 Gato 架构的视觉目标条件决策 Transformer，首次实现了跨多机器人本体的大规模多任务操作，并通过「从实践中自我生成数据 -&gt; 重训练」的</text>
<text x="868" y="1425" font-size="11.5" fill="#a0aab4" text-anchor="end">robocat · arXiv 2306.11706 · v3 auto</text>
