<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">kintsugi-vla</text>
<text x="664" y="142" font-size="12" fill="#57606a" text-anchor="end">利用仿真器的精确状态恢复与分支能力，对失败轨迹上的每个 checkpoint 反复交给固定特权专家续跑，用自适应蒙特卡洛阶梯（5→15→30 次 + 逐点 Wilson 区间）</text>
