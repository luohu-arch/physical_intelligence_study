<svg xmlns="http://www.w3.org/2000/svg" width="660" height="2380" viewBox="26 112 660 2380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>kintsugi-vla</title>
