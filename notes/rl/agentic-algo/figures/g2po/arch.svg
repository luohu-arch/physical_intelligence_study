<rect x="200" y="150" width="267" height="155" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="200" y1="156" x2="200" y2="299" stroke="#0b57d0" stroke-width="3"/>
<text x="333.5" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">被 RL 的策略 Qwen2.5-</text>
<text x="333.5" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">1.5B/7B/14B</text>
<text x="333.5" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">(critic-free, 不养 value 网</text>
<text x="333.5" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">络)</text>
<rect x="202" y="386" width="264" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="202" y1="392" x2="202" y2="518" stroke="#0b57d0" stroke-width="3"/>
<text x="334.0" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">文本环境: WebShop /</text>
<text x="334.0" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">ALFWorld / AppWorld</text>
<text x="334.0" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">稀疏终局奖励, 中间步零奖励</text>
<rect x="208" y="622" width="252" height="105" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="208" y1="628" x2="208" y2="721" stroke="#0b57d0" stroke-width="3"/>
<text x="334.0" y="669.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">每任务 N=8 条并行轨迹</text>
<text x="334.0" y="687.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">多宇宙探索天然共享状态</text>
<rect x="354" y="825" width="265" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="354" y1="831" x2="354" y2="991" stroke="#0b57d0" stroke-width="3"/>
<text x="486.5" y="881.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">状态转移图 (核心): 相同</text>
<text x="486.5" y="899.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">observation 聚为状态组</text>
<text x="486.5" y="919.5" font-size="11.5" fill="#57606a" text-anchor="middle">节点</text>
<text x="486.5" y="934.5" font-size="11.5" fill="#57606a" text-anchor="middle">动作 (G_s, a, G_t) 为有向边,</text>
<text x="486.5" y="949.5" font-size="11.5" fill="#57606a" text-anchor="middle">线性轨迹在图上重新连通</text>
<rect x="199" y="1061" width="269" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="199" y1="1067" x2="199" y2="1227" stroke="#0b57d0" stroke-width="3"/>
<text x="333.5" y="1117.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">组聚合状态价值 V(G_k) =</text>
<text x="333.5" y="1135.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">组内折扣回报平均</text>
<text x="333.5" y="1155.5" font-size="11.5" fill="#57606a" text-anchor="middle">方差 sigma^2 -&gt; sigma^2/|G_k|</text>
<text x="333.5" y="1170.5" font-size="11.5" fill="#57606a" text-anchor="middle">,</text>
<text x="333.5" y="1185.5" font-size="11.5" fill="#57606a" text-anchor="middle">跨轨迹抹掉运气</text>
<rect x="46" y="1297" width="267" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="1303" x2="46" y2="1463" stroke="#0b57d0" stroke-width="3"/>
<text x="179.5" y="1353.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">edge-centric 优势 A_EC</text>
<text x="179.5" y="1371.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">:</text>
<text x="179.5" y="1391.5" font-size="11.5" fill="#57606a" text-anchor="middle">组间 1-step TD error</text>
<text x="179.5" y="1406.5" font-size="11.5" fill="#57606a" text-anchor="middle">在全图所有转移上均值-方差标准化</text>
<text x="179.5" y="1421.5" font-size="11.5" fill="#57606a" text-anchor="middle">(全局标尺)</text>
<rect x="351" y="1297" width="270" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="351" y1="1303" x2="351" y2="1429" stroke="#0b57d0" stroke-width="3"/>
<text x="486.0" y="1351.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">node-centric 优势 A_NC</text>
<text x="486.0" y="1369.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">同源状态各动作的局部相</text>
<text x="486.0" y="1389.5" font-size="11.5" fill="#57606a" text-anchor="middle">对比较</text>
<rect x="48" y="825" width="267" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="48" y1="831" x2="48" y2="957" stroke="#0b57d0" stroke-width="3"/>
<text x="181.5" y="879.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">episode 级优势 A_EP</text>
<text x="181.5" y="897.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">GRPO 式终局归一化, 锚定</text>
<text x="181.5" y="917.5" font-size="11.5" fill="#57606a" text-anchor="middle">任务目标</text>
<rect x="203" y="1533" width="261" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="203" y1="1539" x2="203" y2="1665" stroke="#0b57d0" stroke-width="3"/>
<text x="333.5" y="1587.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">三粒度合成</text>
<text x="333.5" y="1605.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">A = A_EP + w*(A_NC +</text>
<text x="333.5" y="1625.5" font-size="11.5" fill="#57606a" text-anchor="middle">A_EC)</text>
<rect x="200" y="1769" width="267" height="155" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="200" y1="1775" x2="200" y2="1918" stroke="#0b57d0" stroke-width="3"/>
<text x="333.5" y="1824.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">G2PO 目标: 逐样本裁剪代</text>
<text x="333.5" y="1842.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">理 + KL 惩罚</text>
<text x="333.5" y="1862.5" font-size="11.5" fill="#57606a" text-anchor="middle">w=0 时退化为 GRPO; 优势计算纯</text>
<text x="333.5" y="1877.5" font-size="11.5" fill="#57606a" text-anchor="middle">CPU 仅 +1s/步</text>
<rect x="203" y="2005" width="261" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="203" y1="2011" x2="203" y2="2171" stroke="#0b57d0" stroke-width="3"/>
<text x="333.5" y="2061.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">1.5B ALFWorld 95.0 vs</text>
<text x="333.5" y="2079.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">GRPO 72.8 / GiGPO</text>
<text x="333.5" y="2099.5" font-size="11.5" fill="#57606a" text-anchor="middle">86.7</text>
<text x="333.5" y="2114.5" font-size="11.5" fill="#57606a" text-anchor="middle">关键突破型子任务 Look +42.6;</text>
<text x="333.5" y="2129.5" font-size="11.5" fill="#57606a" text-anchor="middle">交互步数 9 -&gt; 5.4</text>
<text x="333.8" y="337.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">rollout</text>
<text x="410.2" y="768.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">收集全部中间 observation, …</text>
<text x="381.0" y="1457.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">逐步策略更新</text>
<text x="621" y="2215" font-size="10.5" fill="#8c959f" text-anchor="end">g2po · arXiv 2606.22995 · v3 auto</text>
