<path d="M 181.5 963.0 L 181.5 1248.0 L 333.5 1248.0 L 333.5 1533.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 333.5 1671.0 L 333.5 1769.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 280.1 1924.0 L 280.1 1294.5 L 360.2 1294.5 L 360.2 305.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
