<path d="M 357.5 1855.0 L 357.5 1981.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 304.1 2136.0 L 304.1 1409.5 L 384.2 1409.5 L 384.2 323.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
