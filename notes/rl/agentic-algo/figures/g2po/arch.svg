<rect x="224" y="168" width="267" height="155" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="224" y1="174" x2="224" y2="317" stroke="#0b57d0" stroke-width="3"/>
<text x="357.5" y="217.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">被 RL 的策略 Qwen2.5-</text>
<text x="357.5" y="238.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">1.5B/7B/14B</text>
<text x="357.5" y="267.0" font-size="12.5" fill="#57606a" text-anchor="middle">(critic-free, 不养 value 网</text>
<text x="357.5" y="284.5" font-size="12.5" fill="#57606a" text-anchor="middle">络)</text>
<rect x="226" y="432" width="264" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="226" y1="438" x2="226" y2="564" stroke="#0b57d0" stroke-width="3"/>
<text x="358.0" y="481.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">文本环境: WebShop /</text>
<text x="358.0" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">ALFWorld / AppWorld</text>
<text x="358.0" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">稀疏终局奖励, 中间步零奖励</text>
<rect x="233" y="697" width="252" height="105" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="233" y1="703" x2="233" y2="796" stroke="#0b57d0" stroke-width="3"/>
<text x="359.0" y="742.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">每任务 N=8 条并行轨迹</text>
<text x="359.0" y="763.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">多宇宙探索天然共享状态</text>
<rect x="396" y="924" width="265" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="396" y1="930" x2="396" y2="1090" stroke="#0b57d0" stroke-width="3"/>
<text x="528.5" y="972.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">状态转移图 (核心): 相同</text>
<text x="528.5" y="993.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">observation 聚为状态组</text>
<text x="528.5" y="1022.75" font-size="12.5" fill="#57606a" text-anchor="middle">节点</text>
<text x="528.5" y="1040.25" font-size="12.5" fill="#57606a" text-anchor="middle">动作 (G_s, a, G_t) 为有向边,</text>
<text x="528.5" y="1057.75" font-size="12.5" fill="#57606a" text-anchor="middle">线性轨迹在图上重新连通</text>
<rect x="223" y="1188" width="269" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="223" y1="1194" x2="223" y2="1354" stroke="#0b57d0" stroke-width="3"/>
<text x="357.5" y="1236.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">组聚合状态价值 V(G_k) =</text>
<text x="357.5" y="1257.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">组内折扣回报平均</text>
<text x="357.5" y="1286.75" font-size="12.5" fill="#57606a" text-anchor="middle">方差 sigma^2 -&gt; sigma^2/|G_k|</text>
<text x="357.5" y="1304.25" font-size="12.5" fill="#57606a" text-anchor="middle">,</text>
<text x="357.5" y="1321.75" font-size="12.5" fill="#57606a" text-anchor="middle">跨轨迹抹掉运气</text>
<rect x="52" y="1453" width="267" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="1459" x2="52" y2="1619" stroke="#0b57d0" stroke-width="3"/>
<text x="185.5" y="1501.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">edge-centric 优势 A_EC</text>
<text x="185.5" y="1522.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">:</text>
<text x="185.5" y="1551.75" font-size="12.5" fill="#57606a" text-anchor="middle">组间 1-step TD error</text>
<text x="185.5" y="1569.25" font-size="12.5" fill="#57606a" text-anchor="middle">在全图所有转移上均值-方差标准化</text>
<text x="185.5" y="1586.75" font-size="12.5" fill="#57606a" text-anchor="middle">(全局标尺)</text>
<rect x="393" y="1453" width="270" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="393" y1="1459" x2="393" y2="1585" stroke="#0b57d0" stroke-width="3"/>
<text x="528.0" y="1502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">node-centric 优势 A_NC</text>
<text x="528.0" y="1523.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">同源状态各动作的局部相</text>
<text x="528.0" y="1552.25" font-size="12.5" fill="#57606a" text-anchor="middle">对比较</text>
<rect x="54" y="924" width="267" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="54" y1="930" x2="54" y2="1056" stroke="#0b57d0" stroke-width="3"/>
<text x="187.5" y="973.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">episode 级优势 A_EP</text>
<text x="187.5" y="994.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">GRPO 式终局归一化, 锚定</text>
<text x="187.5" y="1023.25" font-size="12.5" fill="#57606a" text-anchor="middle">任务目标</text>
<rect x="227" y="1717" width="261" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="227" y1="1723" x2="227" y2="1849" stroke="#0b57d0" stroke-width="3"/>
<text x="357.5" y="1766.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">三粒度合成</text>
<text x="357.5" y="1787.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">A = A_EP + w*(A_NC +</text>
<text x="357.5" y="1816.25" font-size="12.5" fill="#57606a" text-anchor="middle">A_EC)</text>
<rect x="224" y="1981" width="267" height="155" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="224" y1="1987" x2="224" y2="2130" stroke="#0b57d0" stroke-width="3"/>
<text x="357.5" y="2030.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">G2PO 目标: 逐样本裁剪代</text>
<text x="357.5" y="2051.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">理 + KL 惩罚</text>
<text x="357.5" y="2080.0" font-size="12.5" fill="#57606a" text-anchor="middle">w=0 时退化为 GRPO; 优势计算纯</text>
<text x="357.5" y="2097.5" font-size="12.5" fill="#57606a" text-anchor="middle">CPU 仅 +1s/步</text>
<rect x="227" y="2246" width="261" height="172" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="227" y1="2252" x2="227" y2="2412" stroke="#0b57d0" stroke-width="3"/>
<text x="357.5" y="2294.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">1.5B ALFWorld 95.0 vs</text>
<text x="357.5" y="2315.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">GRPO 72.8 / GiGPO</text>
<text x="357.5" y="2344.75" font-size="12.5" fill="#57606a" text-anchor="middle">86.7</text>
<text x="357.5" y="2362.25" font-size="12.5" fill="#57606a" text-anchor="middle">关键突破型子任务 Look +42.6;</text>
<text x="357.5" y="2379.75" font-size="12.5" fill="#57606a" text-anchor="middle">交互步数 9 -&gt; 5.4</text>
<text x="357.8" y="369.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">rollout</text>
<text x="443.8" y="855.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">收集全部中间 observation, …</text>
<text x="427.0" y="1632.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">逐步策略更新</text>
<text x="667" y="2460" font-size="10.5" fill="#8c959f" text-anchor="end">g2po · arXiv 2606.22995 · v3 auto</text>
</svg>
