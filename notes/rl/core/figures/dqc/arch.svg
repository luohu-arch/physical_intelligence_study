<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="471" viewBox="28 79 1218 471" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>DQC：解耦 Q-Chunking</title>
