<svg xmlns="http://www.w3.org/2000/svg" width="1334" height="485" viewBox="30 91 1334 485" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>DQC：解耦 Q-Chunking</title>
