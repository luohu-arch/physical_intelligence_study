<text x="408.5" y="1167.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">SAC 最大熵, 熵系数</text>
<text x="408.5" y="1187.5" font-size="11.5" fill="#57606a" text-anchor="middle">alpha = 0.1</text>
<text x="408.5" y="1202.5" font-size="11.5" fill="#57606a" text-anchor="middle">z 直接拼接到状态后输入</text>
