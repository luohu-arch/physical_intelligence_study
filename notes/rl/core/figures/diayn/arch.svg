<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1484" viewBox="-2 51 794 1484" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>diayn</title>
<rect x="-2" y="51" width="794" height="1484" fill="#ffffff"/>
<text x="20" y="81" font-size="14" font-weight="700" fill="#1f2328">diayn</text>
<text x="770" y="81" font-size="12" fill="#57606a" text-anchor="end">不给出任何任务奖励，只用一个信息论目标——最大化技能与状态的互信息 $I(S;Z)$、同时压低给定状态下技能与动作的互信息 $I(A;Z|S)$、再加上最大熵正则——就能让 S</text>
