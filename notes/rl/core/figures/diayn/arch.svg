<text x="408.0" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">从状态反推技能 (状态判</text>
<text x="408.0" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">别而非动作判别)</text>
