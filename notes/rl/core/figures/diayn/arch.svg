<text x="408.5" y="715.5" font-size="11.5" fill="#57606a" text-anchor="middle">log p(z)</text>
<text x="408.5" y="730.5" font-size="11.5" fill="#57606a" text-anchor="middle">互信息下界的逐时刻形式</text>
