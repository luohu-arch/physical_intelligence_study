<text x="352.5" y="481.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">阶段 1: IL 预训练</text>
<text x="352.5" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">3D 点云扩散策略 BC</text>
<text x="352.5" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">修大体正确 (67.8%)</text>
