<text x="607" y="128" font-size="12" fill="#57606a" text-anchor="end">RL-100 提出三阶段真实世界 RL 框架：(1) 模仿学习预训练（~115 demos/任务、总预算 &lt;100 小时），(2) 迭代离线 RL（PPO 风格更新 + off</text>
