<line x1="220" y1="703" x2="220" y2="846" stroke="#1a7f37" stroke-width="3"/>
<text x="351.0" y="746.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">阶段 2: 迭代离线 RL</text>
<text x="351.0" y="767.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">clipped PPO 直接作用</text>
<text x="351.0" y="796.0" font-size="12.5" fill="#57606a" text-anchor="middle">于去噪每一步</text>
<text x="351.0" y="813.5" font-size="12.5" fill="#57606a" text-anchor="middle">修系统性偏差 (91.8%)</text>
<rect x="388" y="168" width="261" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="388" y1="174" x2="388" y2="317" stroke="#0b57d0" stroke-width="3"/>
<text x="518.5" y="217.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">OPE 门控 (保险丝)</text>
<text x="518.5" y="238.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">保守 Q 估计</text>
<text x="518.5" y="267.0" font-size="12.5" fill="#57606a" text-anchor="middle">Q_new &gt;= Q_old + delta 才</text>
<text x="518.5" y="284.5" font-size="12.5" fill="#57606a" text-anchor="middle">接受</text>
<rect x="217" y="961" width="266" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="217" y1="967" x2="217" y2="1093" stroke="#1a7f37" stroke-width="3"/>
