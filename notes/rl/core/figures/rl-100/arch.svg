<line x1="46" y1="156" x2="46" y2="299" stroke="#0969da" stroke-width="3"/>
<text x="177.0" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">演示数据: 约 115 demos</text>
<text x="177.0" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">/</text>
<text x="177.0" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">任务</text>
<text x="177.0" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">总预算 &lt; 100 小时</text>
<rect x="215" y="386" width="223" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="215" y1="392" x2="215" y2="518" stroke="#1a7f37" stroke-width="3"/>
<text x="326.5" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">阶段 1: IL 预训练</text>
<text x="326.5" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">3D 点云扩散策略 BC</text>
<text x="326.5" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">修大体正确 (67.8%)</text>
<rect x="196" y="622" width="262" height="155" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="196" y1="628" x2="196" y2="771" stroke="#1a7f37" stroke-width="3"/>
<text x="327.0" y="677.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">阶段 2: 迭代离线 RL</text>
<text x="327.0" y="695.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">clipped PPO 直接作用</text>
<text x="327.0" y="715.5" font-size="11.5" fill="#57606a" text-anchor="middle">于去噪每一步</text>
<text x="327.0" y="730.5" font-size="11.5" fill="#57606a" text-anchor="middle">修系统性偏差 (91.8%)</text>
<rect x="346" y="150" width="261" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="346" y1="156" x2="346" y2="299" stroke="#0b57d0" stroke-width="3"/>
<text x="476.5" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">OPE 门控 (保险丝)</text>
<text x="476.5" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">保守 Q 估计</text>
<text x="476.5" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">Q_new &gt;= Q_old + delta 才</text>
<text x="476.5" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">接受</text>
<rect x="194" y="858" width="266" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="194" y1="864" x2="194" y2="990" stroke="#1a7f37" stroke-width="3"/>
<text x="327.0" y="912.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">阶段 3: 在线 RL</text>
<text x="327.0" y="930.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">小于 50 episodes</text>
<text x="327.0" y="950.5" font-size="11.5" fill="#57606a" text-anchor="middle">修最后 1% corner case (100%)</text>
<rect x="196" y="1330" width="261" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="196" y1="1336" x2="196" y2="1462" stroke="#57606a" stroke-width="3"/>
<text x="326.5" y="1384.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">真实机器人 (8 任务)</text>
<text x="326.5" y="1402.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">UR5 / Franka / xArm /</text>
<text x="326.5" y="1422.5" font-size="11.5" fill="#57606a" text-anchor="middle">LeapHand</text>
<rect x="210" y="1566" width="234" height="104" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="210" y1="1572" x2="210" y2="1664" stroke="#8a5a00" stroke-width="3"/>
<text x="327.0" y="1622.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">人工二值终局奖励判定</text>
<rect x="200" y="1094" width="253" height="155" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="200" y1="1100" x2="200" y2="1243" stroke="#8250df" stroke-width="3"/>
<text x="326.5" y="1149.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">一致性蒸馏 (部署加速)</text>
<text x="326.5" y="1167.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">多步 DDIM -&gt; 1 步控</text>
<text x="326.5" y="1187.5" font-size="11.5" fill="#57606a" text-anchor="middle">制器</text>
<text x="326.5" y="1202.5" font-size="11.5" fill="#57606a" text-anchor="middle">延迟降约 10 倍, 20 Hz 控制</text>
<text x="401.8" y="455.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">拒绝降质更新, 防分布偏移崩溃</text>
<text x="316.9" y="1325.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">失败 / 成功对比样本</text>
<text x="326.5" y="1281.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">部署级可靠性: 1000/1000 商…</text>
