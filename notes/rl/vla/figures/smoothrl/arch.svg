<text x="181.5" y="459.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">base policy 50 eps 初</text>
<text x="181.5" y="479.5" font-size="11.5" fill="#57606a" text-anchor="middle">始化</text>
<text x="181.5" y="494.5" font-size="11.5" fill="#57606a" text-anchor="middle">+ 在线 rollout + 人工干预</text>
<rect x="52" y="166" width="257" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="172" x2="52" y2="265" stroke="#0969da" stroke-width="3"/>
<text x="180.5" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">人工干预 (绝对 / 残差)</text>
<text x="180.5" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">+ 二值终局奖励</text>
<rect x="46" y="622" width="267" height="172" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="628" x2="46" y2="788" stroke="#8a5a00" stroke-width="3"/>
<text x="179.5" y="678.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">critic 集成 (REDQ)</text>
<text x="179.5" y="696.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">输入 [z, s, a_tilde[0,</text>
<text x="179.5" y="716.5" font-size="11.5" fill="#57606a" text-anchor="middle">n), a[n,2n)]</text>
