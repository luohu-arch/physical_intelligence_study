<rect x="390" y="168" width="261" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="390" y1="174" x2="390" y2="300" stroke="#57606a" stroke-width="3"/>
<text x="520.5" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">机器人 (Astribot S1)</text>
<text x="520.5" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">latency budget n = 6</text>
<text x="520.5" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">帧 = 200 ms</text>
<rect x="390" y="432" width="261" height="138" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="390" y1="438" x2="390" y2="564" stroke="#0969da" stroke-width="3"/>
<text x="520.5" y="481.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">观测 s_t</text>
<text x="520.5" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">+ 在飞动作前缀 a_tilde</text>
<text x="520.5" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">[0,n)</text>
<rect x="393" y="697" width="264" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="393" y1="703" x2="393" y2="829" stroke="#57606a" stroke-width="3"/>
<text x="525.0" y="746.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">冻结 pi_base (pi 0.5)</text>
<text x="525.0" y="767.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">输出参考 chunk a_bar (</text>
<text x="525.0" y="796.25" font-size="12.5" fill="#57606a" text-anchor="middle">H = 32) + RL token z_t</text>
<rect x="221" y="961" width="267" height="151" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="221" y1="967" x2="221" y2="1106" stroke="#0b57d0" stroke-width="3"/>
<text x="354.5" y="1009.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">chunk 三区划分 (核心)</text>
<text x="354.5" y="1038.75" font-size="12.5" fill="#57606a" text-anchor="middle">committed [0,n): 已占用</text>
<text x="354.5" y="1056.25" font-size="12.5" fill="#57606a" text-anchor="middle">execution [n,2n): 唯一执行</text>
<text x="354.5" y="1073.75" font-size="12.5" fill="#57606a" text-anchor="middle">discarded [2n,H): 被覆盖</text>
<rect x="221" y="1225" width="267" height="155" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="221" y1="1231" x2="221" y2="1374" stroke="#1a7f37" stroke-width="3"/>
<text x="354.5" y="1274.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">残差 actor (3 层 MLP)</text>
<text x="354.5" y="1295.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">a = a_bar + 有界 delta</text>
<text x="354.5" y="1324.0" font-size="12.5" fill="#57606a" text-anchor="middle">(界 0.05)</text>
<text x="354.5" y="1341.5" font-size="12.5" fill="#57606a" text-anchor="middle">梯度只流经 execution 区</text>
<rect x="58" y="432" width="259" height="155" rx="6" fill="#fdf3f8" stroke="#d0d7de" stroke-width="1"/>
<line x1="58" y1="438" x2="58" y2="581" stroke="#bf3989" stroke-width="3"/>
