<svg xmlns="http://www.w3.org/2000/svg" width="675" height="1375" viewBox="26 59 675 1375" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>smoothrl</title>
<rect x="26" y="59" width="675" height="1375" fill="#ffffff"/>
<text x="48" y="89" font-size="14" font-weight="700" fill="#1f2328">smoothrl</text>
<text x="679" y="89" font-size="12" fill="#57606a" text-anchor="end">Problem**：VLA/WAM 推理延迟高 → 部署标配是"异步推理 + action chunk"（推理与执行重叠），但现有在线 RL 全部假设同步执行——训练目标与部署</text>
