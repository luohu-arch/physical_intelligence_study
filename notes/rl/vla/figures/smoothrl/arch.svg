<rect x="348" y="150" width="261" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="348" y1="156" x2="348" y2="282" stroke="#57606a" stroke-width="3"/>
<text x="478.5" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">机器人 (Astribot S1)</text>
<text x="478.5" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">latency budget n = 6</text>
<text x="478.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">帧 = 200 ms</text>
<rect x="348" y="386" width="261" height="138" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="348" y1="392" x2="348" y2="518" stroke="#0969da" stroke-width="3"/>
<text x="478.5" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">观测 s_t</text>
<text x="478.5" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">+ 在飞动作前缀 a_tilde</text>
<text x="478.5" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">[0,n)</text>
<rect x="351" y="622" width="264" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="351" y1="628" x2="351" y2="754" stroke="#57606a" stroke-width="3"/>
<text x="483.0" y="676.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">冻结 pi_base (pi 0.5)</text>
<text x="483.0" y="694.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">输出参考 chunk a_bar (</text>
<text x="483.0" y="714.5" font-size="11.5" fill="#57606a" text-anchor="middle">H = 32) + RL token z_t</text>
<rect x="197" y="858" width="267" height="151" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="197" y1="864" x2="197" y2="1003" stroke="#0b57d0" stroke-width="3"/>
<text x="330.5" y="913.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">chunk 三区划分 (核心)</text>
<text x="330.5" y="933.0" font-size="11.5" fill="#57606a" text-anchor="middle">committed [0,n): 已占用</text>
<text x="330.5" y="948.0" font-size="11.5" fill="#57606a" text-anchor="middle">execution [n,2n): 唯一执行</text>
<text x="330.5" y="963.0" font-size="11.5" fill="#57606a" text-anchor="middle">discarded [2n,H): 被覆盖</text>
<rect x="197" y="1094" width="267" height="155" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="197" y1="1100" x2="197" y2="1243" stroke="#1a7f37" stroke-width="3"/>
<text x="330.5" y="1149.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">残差 actor (3 层 MLP)</text>
<text x="330.5" y="1167.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">a = a_bar + 有界 delta</text>
<text x="330.5" y="1187.5" font-size="11.5" fill="#57606a" text-anchor="middle">(界 0.05)</text>
<text x="330.5" y="1202.5" font-size="11.5" fill="#57606a" text-anchor="middle">梯度只流经 execution 区</text>
<rect x="52" y="386" width="259" height="155" rx="6" fill="#fdf3f8" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="392" x2="52" y2="535" stroke="#bf3989" stroke-width="3"/>
