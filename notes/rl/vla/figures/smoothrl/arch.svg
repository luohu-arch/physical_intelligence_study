<svg xmlns="http://www.w3.org/2000/svg" width="634" height="1246" viewBox="24 51 634 1246" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>smoothrl</title>
<rect x="24" y="51" width="634" height="1246" fill="#ffffff"/>
<text x="46" y="81" font-size="14" font-weight="700" fill="#1f2328">smoothrl</text>
<text x="636" y="81" font-size="12" fill="#57606a" text-anchor="end">Problem**：VLA/WAM 推理延迟高 → 部署标配是"异步推理 + action chunk"（推理与执行重叠），但现有在线 RL 全部假设同步执行——训练目标与部署</text>
