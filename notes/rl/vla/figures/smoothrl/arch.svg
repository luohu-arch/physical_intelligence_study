<text x="187.5" y="502.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">base policy 50 eps 初</text>
<text x="187.5" y="531.0" font-size="12.5" fill="#57606a" text-anchor="middle">始化</text>
<text x="187.5" y="548.5" font-size="12.5" fill="#57606a" text-anchor="middle">+ 在线 rollout + 人工干预</text>
<rect x="58" y="186" width="257" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="58" y1="192" x2="58" y2="285" stroke="#0969da" stroke-width="3"/>
<text x="186.5" y="231.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">人工干预 (绝对 / 残差)</text>
<text x="186.5" y="252.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">+ 二值终局奖励</text>
<rect x="52" y="697" width="267" height="172" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="703" x2="52" y2="863" stroke="#8a5a00" stroke-width="3"/>
<text x="185.5" y="745.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">critic 集成 (REDQ)</text>
<text x="185.5" y="766.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">输入 [z, s, a_tilde[0,</text>
<text x="185.5" y="795.75" font-size="12.5" fill="#57606a" text-anchor="middle">n), a[n,2n)]</text>
