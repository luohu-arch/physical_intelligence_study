<text x="41" y="344" font-size="11.5" font-weight="600" fill="#57606a">异步分布式采样 (8 台 AGILE PiPER, ZeroMQ </text>
<text x="41" y="359" font-size="11.5" font-weight="600" fill="#57606a">+…</text>
