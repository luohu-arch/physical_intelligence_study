<svg xmlns="http://www.w3.org/2000/svg" width="365" height="2061" viewBox="1 112 365 2061" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>vlac</title>
<rect x="1" y="112" width="365" height="2061" fill="#ffffff"/>
<text x="23" y="142" font-size="14" font-weight="700" fill="#1f2328">vlac</text>
<text x="344" y="142" font-size="12" fill="#57606a" text-anchor="end">VLAC 提出统一 actor-critic 自回归架构：基于 InternVL 多模态模型，通过 pair-wise progress understanding 输入两张观</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
