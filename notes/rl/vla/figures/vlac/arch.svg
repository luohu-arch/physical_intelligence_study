<line x1="62" y1="401" x2="62" y2="527" stroke="#57606a" stroke-width="3"/>
<text x="187.5" y="444.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">真实机器人 x 8</text>
<text x="187.5" y="465.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">7-DoF EE delta pose</text>
<text x="187.5" y="494.25" font-size="12.5" fill="#57606a" text-anchor="middle">逐步控制</text>
<rect x="56" y="660" width="261" height="138" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="56" y1="666" x2="56" y2="792" stroke="#0969da" stroke-width="3"/>
<text x="186.5" y="709.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">pair 输入</text>
<text x="186.5" y="730.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">当前帧 + 历史帧 (o_t,</text>
<text x="186.5" y="759.25" font-size="12.5" fill="#57606a" text-anchor="middle">o_prev) + 指令</text>
<rect x="72" y="924" width="233" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="72" y1="930" x2="72" y2="1056" stroke="#57606a" stroke-width="3"/>
<text x="188.5" y="973.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">InternVL 多模态主干</text>
<text x="188.5" y="994.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">40M 样本预训练</text>
<text x="188.5" y="1023.25" font-size="12.5" fill="#57606a" text-anchor="middle">prompt 切换双模式</text>
<rect x="56" y="1981" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="56" y1="1987" x2="56" y2="2113" stroke="#1a7f37" stroke-width="3"/>
<text x="186.5" y="2030.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">actor 模式 (2B)</text>
<text x="186.5" y="2051.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">semantic delta EE</text>
<text x="186.5" y="2080.25" font-size="12.5" fill="#57606a" text-anchor="middle">pose</text>
<rect x="53" y="1188" width="267" height="172" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="53" y1="1194" x2="53" y2="1354" stroke="#0b57d0" stroke-width="3"/>
<text x="186.5" y="1236.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">critic 模式 (8B):</text>
<text x="186.5" y="1257.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">pair-wise 进度 (核心)</text>
<text x="186.5" y="1286.75" font-size="12.5" fill="#57606a" text-anchor="middle">两帧对比输出连续 progress</text>
<text x="186.5" y="1304.25" font-size="12.5" fill="#57606a" text-anchor="middle">delta</text>
<text x="186.5" y="1321.75" font-size="12.5" fill="#57606a" text-anchor="middle">正 = 前进, 负 = 倒退</text>
<rect x="52" y="1453" width="269" height="172" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="1459" x2="52" y2="1619" stroke="#8a5a00" stroke-width="3"/>
<text x="186.5" y="1501.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">dense 进度奖励 r 在 [-1</text>
<text x="186.5" y="1522.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">,</text>
<text x="186.5" y="1551.75" font-size="12.5" fill="#57606a" text-anchor="middle">1]</text>
<text x="186.5" y="1569.25" font-size="12.5" fill="#57606a" text-anchor="middle">替代稀疏 0/1 (瓶颈是 reward</text>
<text x="186.5" y="1586.75" font-size="12.5" fill="#57606a" text-anchor="middle">不是算法)</text>
<rect x="53" y="1717" width="267" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="53" y1="1723" x2="53" y2="1849" stroke="#8a5a00" stroke-width="3"/>
<text x="186.5" y="1766.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">PPO 更新 (clipped</text>
<text x="186.5" y="1787.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">surrogate)</text>
<text x="186.5" y="1816.25" font-size="12.5" fill="#57606a" text-anchor="middle">优势 A_t 由进度 delta 累积</text>
<rect x="62" y="168" width="251" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="62" y1="174" x2="62" y2="267" stroke="#0969da" stroke-width="3"/>
<text x="187.5" y="213.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">人类引导探索 HGE</text>
<text x="187.5" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(困难任务辅助, +10pp)</text>
<text x="186.5" y="1910.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">更新 actor</text>
<text x="187.5" y="326.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">引导 rollout</text>
