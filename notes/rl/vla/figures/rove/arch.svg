<text x="592" y="81" font-size="12" fill="#57606a" text-anchor="end">ROVE 解决人形机器人 VLA 部署后的核心痛点：人类遥操作干预数据本身是不完美的（犹豫、错误、重映射噪声）。提出乐观价值估计（OVE）——用 expectile regre</text>
