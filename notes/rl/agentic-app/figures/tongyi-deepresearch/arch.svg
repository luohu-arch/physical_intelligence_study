<text x="694.5" y="1324.0" font-size="12.5" fill="#57606a" text-anchor="middle">IS 比恒 1.0 + clip-higher +</text>
<text x="694.5" y="1341.5" font-size="12.5" fill="#57606a" text-anchor="middle">leave-one-out</text>
