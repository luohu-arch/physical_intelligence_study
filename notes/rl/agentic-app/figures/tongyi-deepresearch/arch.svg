<text x="1034.5" y="1853.0" font-size="12.5" fill="#57606a" text-anchor="middle">缓存 / 重试 /</text>
<text x="1034.5" y="1870.5" font-size="12.5" fill="#57606a" text-anchor="middle">降级 / 备份源, 工具调用确定性化</text>
