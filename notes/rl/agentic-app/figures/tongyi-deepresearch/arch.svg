<text x="937.5" y="1639.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">/</text>
<text x="937.5" y="1659.5" font-size="11.5" fill="#57606a" text-anchor="middle">缓存 / 重试 /</text>
<text x="937.5" y="1674.5" font-size="11.5" fill="#57606a" text-anchor="middle">降级 / 备份源, 工具调用确定性化</text>
