<text x="862.0" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">无格式项</text>
<text x="862.0" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">超长未答负样本从损失剔除</text>
