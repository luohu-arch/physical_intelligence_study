<text x="695.0" y="767.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">128K 上下文</text>
<text x="695.0" y="796.0" font-size="12.5" fill="#57606a" text-anchor="middle">64K-128K 长轨迹 + 少量通用数据</text>
<text x="695.0" y="813.5" font-size="12.5" fill="#57606a" text-anchor="middle">防遗忘</text>
