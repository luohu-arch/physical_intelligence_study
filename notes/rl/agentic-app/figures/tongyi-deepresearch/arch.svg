<text x="694.5" y="481.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Agentic CPT Stage 1:</text>
<text x="694.5" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">32K 上下文</text>
<text x="694.5" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">合成数据注入 agentic 行为先验</text>
