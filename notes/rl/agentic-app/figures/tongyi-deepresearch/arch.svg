<text x="890.5" y="1403.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">/ Python Interpreter /</text>
<text x="890.5" y="1423.5" font-size="11.5" fill="#57606a" text-anchor="middle">Scholar / File Parser, 每任务</text>
<text x="890.5" y="1438.5" font-size="11.5" fill="#57606a" text-anchor="middle">&lt;=128 次调用</text>
