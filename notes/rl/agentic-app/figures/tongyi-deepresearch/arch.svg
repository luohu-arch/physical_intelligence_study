<text x="635.0" y="931.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">128K</text>
<text x="635.0" y="951.5" font-size="11.5" fill="#57606a" text-anchor="middle">ReAct + Context Management 双</text>
<text x="635.0" y="966.5" font-size="11.5" fill="#57606a" text-anchor="middle">模式轨迹</text>
