<text x="634.5" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Agentic CPT Stage 1:</text>
<text x="634.5" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">32K 上下文</text>
<text x="634.5" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">合成数据注入 agentic 行为先验</text>
