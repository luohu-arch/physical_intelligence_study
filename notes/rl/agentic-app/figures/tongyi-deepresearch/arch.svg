<text x="635.0" y="695.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">128K 上下文</text>
<text x="635.0" y="715.5" font-size="11.5" fill="#57606a" text-anchor="middle">64K-128K 长轨迹 + 少量通用数据</text>
<text x="635.0" y="730.5" font-size="11.5" fill="#57606a" text-anchor="middle">防遗忘</text>
