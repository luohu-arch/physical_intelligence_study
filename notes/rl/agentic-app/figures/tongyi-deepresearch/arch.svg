<text x="634.5" y="1149.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Agentic RL: 严格 on-</text>
<text x="634.5" y="1167.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">policy GRPO 变体</text>
<text x="634.5" y="1187.5" font-size="11.5" fill="#57606a" text-anchor="middle">IS 比恒 1.0 + clip-higher +</text>
<text x="634.5" y="1202.5" font-size="11.5" fill="#57606a" text-anchor="middle">leave-one-out</text>
