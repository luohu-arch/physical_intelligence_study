<text x="478.0" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">world 零成本无限扩 /</text>
<text x="478.0" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">simulated 离线 wiki 风洞 /</text>
<text x="478.0" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">real-world 非平稳终训</text>
