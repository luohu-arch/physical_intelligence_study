<text x="784.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">无格式项</text>
<text x="784.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">超长未答负样本从损失剔除</text>
