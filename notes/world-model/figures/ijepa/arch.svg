<text x="658" y="142" font-size="12" fill="#57606a" text-anchor="end">I-JEPA 用一张图的少量上下文 patch 去预测同图中若干大块目标区域的 EMA target-encoder 表征（L2 损失只算在表征空间），配合"多块 + 大目标块</text>
