<svg xmlns="http://www.w3.org/2000/svg" width="610" height="1317" viewBox="24 98 610 1317" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>ijepa</title>
<rect x="24" y="98" width="610" height="1317" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">ijepa</text>
<text x="612" y="128" font-size="12" fill="#57606a" text-anchor="end">I-JEPA 用一张图的少量上下文 patch 去预测同图中若干大块目标区域的 EMA target-encoder 表征（L2 损失只算在表征空间），配合"多块 + 大目标块</text>
<defs>
