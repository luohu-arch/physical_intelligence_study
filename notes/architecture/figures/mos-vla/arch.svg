<text x="440.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">16 步重算系数</text>
<rect x="478" y="1736" width="238" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
