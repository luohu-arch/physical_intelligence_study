<text x="1030.0" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">保持基函数多样性</text>
<rect x="306" y="150" width="269" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
