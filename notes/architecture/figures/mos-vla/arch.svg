<text x="1173" y="81" font-size="12" fill="#57606a" text-anchor="end">MoS-VLA 将机器人操作策略表示为一组可学习基函数的线性组合（Mixture-of-Skills），在 Open X-Embodiment 上跨数据集联合预训练后，给定一次</text>
