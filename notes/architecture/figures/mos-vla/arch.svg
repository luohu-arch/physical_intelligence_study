<svg xmlns="http://www.w3.org/2000/svg" width="1287" height="2044" viewBox="-4 59 1287 2044" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
