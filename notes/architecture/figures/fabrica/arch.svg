<line x1="46" y1="172" x2="46" y2="265" stroke="#0969da" stroke-width="3"/>
<text x="127.0" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">CAD 模型</text>
<text x="127.0" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">多零件装配体</text>
<rect x="476" y="386" width="180" height="104" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="476" y1="392" x2="476" y2="484" stroke="#57606a" stroke-width="3"/>
<text x="566.0" y="442.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">装配优先级推理</text>
