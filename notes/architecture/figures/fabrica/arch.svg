<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="1915" viewBox="26 112 1188 1915" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>fabrica</title>
<rect x="26" y="112" width="1188" height="1915" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">fabrica</text>
<text x="1192" y="142" font-size="12" fill="#57606a" text-anchor="end">Fabrica 是一个端到端双臂装配系统：从 CAD 模型出发，通过层级规划（装配顺序→抓取→运动规划+自动夹具生成）+ 轻量 SE(3) 等变 RL 策略完成接触-rich </text>
