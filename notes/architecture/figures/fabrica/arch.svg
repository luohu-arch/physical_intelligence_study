<line x1="488" y1="1384" x2="488" y2="1510" stroke="#1a7f37" stroke-width="3"/>
<text x="618.5" y="1427.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">SE(3) 等变 RL 策略</text>
<text x="618.5" y="1448.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">~2M 参数, 输出残差修正</text>
<text x="618.5" y="1477.25" font-size="12.5" fill="#57606a" text-anchor="middle">a_t = a_t^ol + pi_theta(o_t)</text>
<rect x="276" y="168" width="254" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="276" y1="174" x2="276" y2="300" stroke="#0b57d0" stroke-width="3"/>
<text x="403.0" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">SE(3) 等变结构</text>
<text x="403.0" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">零样本 sim-to-real</text>
<text x="403.0" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">保证</text>
<rect x="603" y="168" width="264" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="603" y1="174" x2="603" y2="300" stroke="#8a5a00" stroke-width="3"/>
<text x="735.0" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">插接奖励 r = -||p -</text>
<text x="735.0" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">p*||_2</text>
<text x="735.0" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">零件到目标的负 L2 距离</text>
