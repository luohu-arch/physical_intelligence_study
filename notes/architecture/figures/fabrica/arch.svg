<line x1="433" y1="594" x2="433" y2="720" stroke="#57606a" stroke-width="3"/>
<text x="566.5" y="642.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">装配序列规划</text>
<text x="566.5" y="660.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">序列 + 抓取 + 运动 联合</text>
<text x="566.5" y="680.5" font-size="11.5" fill="#57606a" text-anchor="middle">优化</text>
<rect x="476" y="824" width="182" height="105" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="476" y1="830" x2="476" y2="923" stroke="#57606a" stroke-width="3"/>
<text x="567.0" y="871.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">抓取规划</text>
<text x="567.0" y="889.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">+ 自动夹具生成</text>
<rect x="492" y="1027" width="150" height="105" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="492" y1="1033" x2="492" y2="1126" stroke="#57606a" stroke-width="3"/>
<text x="567.0" y="1074.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">运动规划</text>
<text x="567.0" y="1092.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">双臂协调</text>
<rect x="446" y="1466" width="241" height="104" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="446" y1="1472" x2="446" y2="1564" stroke="#8250df" stroke-width="3"/>
<text x="566.5" y="1522.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">双 Franka 执行装配步</text>
<rect x="436" y="1230" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="436" y1="1236" x2="436" y2="1362" stroke="#1a7f37" stroke-width="3"/>
<text x="566.5" y="1284.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">SE(3) 等变 RL 策略</text>
<text x="566.5" y="1302.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">~2M 参数, 输出残差修正</text>
<text x="566.5" y="1322.5" font-size="11.5" fill="#57606a" text-anchor="middle">a_t = a_t^ol + pi_theta(o_t)</text>
<rect x="246" y="150" width="254" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="246" y1="156" x2="246" y2="282" stroke="#0b57d0" stroke-width="3"/>
<text x="373.0" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">SE(3) 等变结构</text>
<text x="373.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">零样本 sim-to-real</text>
<text x="373.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">保证</text>
<rect x="538" y="150" width="264" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="538" y1="156" x2="538" y2="282" stroke="#8a5a00" stroke-width="3"/>
<text x="670.0" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">插接奖励 r = -||p -</text>
<text x="670.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">p*||_2</text>
<text x="670.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">零件到目标的负 L2 距离</text>
<rect x="840" y="166" width="247" height="105" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="840" y1="172" x2="840" y2="265" stroke="#57606a" stroke-width="3"/>
<text x="963.5" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Isaac Gym 仿真训练</text>
<text x="963.5" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">域随机化 3mm 姿态噪声</text>
<rect x="438" y="1668" width="256" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="438" y1="1674" x2="438" y2="1767" stroke="#8250df" stroke-width="3"/>
<text x="566.0" y="1715.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">装配完成</text>
<text x="566.0" y="1733.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">step-level 80% 无干预</text>
<text x="566.8" y="1291.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">转运段: 开环跟踪规划轨迹</text>
<text x="566.8" y="1173.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">开环参考轨迹 a_t^ol</text>
<text x="566.5" y="1409.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">接触丰富的插接步 TSI 阻抗控制</text>
<text x="765.0" y="742.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">零样本迁移</text>
<text x="552.7" y="1663.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">状态检测失败 每步最多重试 3 次</text>
<text x="1087" y="1811" font-size="10.5" fill="#8c959f" text-anchor="end">fabrica · arXiv 2506.05168 · v3 auto</text>
