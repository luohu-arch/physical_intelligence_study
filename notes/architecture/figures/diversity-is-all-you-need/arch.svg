<text x="479.5" y="885.5" font-size="11.5" fill="#57606a" text-anchor="middle">min | ARM(o_t) - v(a_t:t+L) |</text>
<text x="479.5" y="900.5" font-size="11.5" fill="#57606a" text-anchor="middle">L 限定在 [0.5T, 1.5T]</text>
