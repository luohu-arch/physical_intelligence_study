<svg xmlns="http://www.w3.org/2000/svg" width="910" height="1555" viewBox="24 98 910 1555" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>diversity-is-all-you-need</title>
<rect x="24" y="98" width="910" height="1555" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">diversity-is-all-you-need</text>
<text x="912" y="128" font-size="12" fill="#57606a" text-anchor="end">用同规模不同采样方式构造的预训练集做受控对比，发现：任务多样性里**场景多样性比技能多样性更能带来分布偏移下的鲁棒性**（GO-1 上 10% episode 采样平均分 0.</text>
