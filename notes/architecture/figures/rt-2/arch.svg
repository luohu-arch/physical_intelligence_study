<text x="481.0" y="502.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">门外语 (核心)</text>
<text x="481.0" y="531.0" font-size="12.5" fill="#57606a" text-anchor="middle">动作 token 与 web 数据混采</text>
<text x="481.0" y="548.5" font-size="12.5" fill="#57606a" text-anchor="middle">机器人数据占 50% / 66%, 防遗忘</text>
