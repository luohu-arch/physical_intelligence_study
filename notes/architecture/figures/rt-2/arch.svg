<text x="711.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(等价行为克隆, 零架构改</text>
<text x="711.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">动)</text>
<rect x="161" y="622" width="262" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
