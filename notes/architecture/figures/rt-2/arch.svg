<text x="444.5" y="914.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">output constraint 推理</text>
<text x="444.5" y="932.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">约束</text>
<text x="444.5" y="952.5" font-size="11.5" fill="#57606a" text-anchor="middle">机器人 prompt 只在合法动作</text>
<text x="444.5" y="967.5" font-size="11.5" fill="#57606a" text-anchor="middle">token 内采样</text>
<text x="444.5" y="982.5" font-size="11.5" fill="#57606a" text-anchor="middle">普通 VQA 任务仍开放全词表</text>
