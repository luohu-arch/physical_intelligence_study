<text x="173.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">130k, 13 台机器人 17</text>
<text x="173.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">个月</text>
