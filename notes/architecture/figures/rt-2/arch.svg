<text x="292.0" y="676.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">RT-2 PaLI-X 5B / 55B</text>
<text x="292.0" y="694.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">1000 内整数 token 直接</text>
<text x="292.0" y="714.5" font-size="11.5" fill="#57606a" text-anchor="middle">复用</text>
