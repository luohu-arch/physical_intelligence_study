<svg xmlns="http://www.w3.org/2000/svg" width="841" height="1418" viewBox="24 98 841 1418" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>rt-2</title>
<rect x="24" y="98" width="841" height="1418" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">rt-2</text>
<text x="843" y="128" font-size="12" fill="#57606a" text-anchor="end">RT-2 不设计任何新架构、不加任何动作专用层，只把机器人动作按 RT-1 方式切成整数 token、当作普通文本放进 VLM 的训练目标里 co-fine-tune（PaLI</text>
