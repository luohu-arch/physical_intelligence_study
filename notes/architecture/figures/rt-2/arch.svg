<text x="439.5" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">10B 过滤到 1B</text>
<rect x="312" y="386" width="264" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="312" y1="392" x2="312" y2="535" stroke="#0b57d0" stroke-width="3"/>
<text x="444.0" y="441.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">co-fine-tune: 动作即一</text>
<text x="444.0" y="459.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">门外语 (核心)</text>
<text x="444.0" y="479.5" font-size="11.5" fill="#57606a" text-anchor="middle">动作 token 与 web 数据混采</text>
<text x="444.0" y="494.5" font-size="11.5" fill="#57606a" text-anchor="middle">机器人数据占 50% / 66%, 防遗忘</text>
