<text x="594.5" y="694.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">覆写词表 256 个最低频</text>
<text x="594.5" y="714.5" font-size="11.5" fill="#57606a" text-anchor="middle">token</text>
