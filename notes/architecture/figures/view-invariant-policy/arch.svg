<text x="482.5" y="1698.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(ACT / DP / SmolVLA)</text>
<rect x="652" y="150" width="267" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
