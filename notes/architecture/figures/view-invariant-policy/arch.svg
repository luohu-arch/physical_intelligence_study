<text x="482.5" y="1891.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">动作输出: 相机移动后策略</text>
<text x="482.5" y="1909.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">不失效</text>
<text x="482.5" y="1929.5" font-size="11.5" fill="#57606a" text-anchor="middle">3 架构 6 任务全部正增益</text>
