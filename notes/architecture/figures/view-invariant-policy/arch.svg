<text x="524.5" y="2105.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">动作输出: 相机移动后策略</text>
<text x="524.5" y="2126.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">不失效</text>
<text x="524.5" y="2155.0" font-size="12.5" fill="#57606a" text-anchor="middle">3 架构 6 任务全部正增益</text>
<text x="524.5" y="2172.5" font-size="12.5" fill="#57606a" text-anchor="middle">(SmolVLA Lift 19.6 -&gt; 54.4)</text>
