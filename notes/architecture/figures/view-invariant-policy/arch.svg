<text x="179.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(AprilTags / 标定 / 元</text>
<text x="179.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">数据)</text>
<rect x="228" y="386" width="264" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="228" y1="392" x2="228" y2="535" stroke="#0b57d0" stroke-width="3"/>
<text x="360.0" y="441.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Plucker Ray 编码</text>
<text x="360.0" y="459.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">d = R*K^-1*[u,v,1]^T</text>
<text x="360.0" y="479.5" font-size="11.5" fill="#57606a" text-anchor="middle">m = t x d; 每像素 6 维:</text>
<text x="360.0" y="494.5" font-size="11.5" fill="#57606a" text-anchor="middle">方向 + 矩, 对相机位姿等变</text>
<rect x="362" y="622" width="241" height="104" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="362" y1="628" x2="362" y2="720" stroke="#0969da" stroke-width="3"/>
<text x="482.5" y="678.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Plucker map [H,W,6]</text>
<rect x="350" y="150" width="264" height="155" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="350" y1="156" x2="350" y2="299" stroke="#0969da" stroke-width="3"/>
<text x="482.0" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">图像与 Plucker map 联合</text>
<text x="482.0" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">随机裁剪</text>
<text x="482.0" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">(相同空间裁剪, 防背景泄露相机位</text>
<text x="482.0" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">姿)</text>
<rect x="240" y="1026" width="218" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="240" y1="1032" x2="240" y2="1125" stroke="#1a7f37" stroke-width="3"/>
<text x="349.0" y="1073.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">channel-wise 拼接</text>
<text x="349.0" y="1091.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">成 [H,W,9] 输入</text>
<rect x="496" y="1026" width="230" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="496" y1="1032" x2="496" y2="1125" stroke="#1a7f37" stroke-width="3"/>
<text x="611.0" y="1073.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">late fusion 小 CNN</text>
<text x="611.0" y="1091.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(不污染预训练权重)</text>
<rect x="386" y="1229" width="192" height="104" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="386" y1="1235" x2="386" y2="1327" stroke="#57606a" stroke-width="3"/>
<text x="482.0" y="1285.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Vision Encoder</text>
<rect x="384" y="1431" width="198" height="104" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="384" y1="1437" x2="384" y2="1529" stroke="#1a7f37" stroke-width="3"/>
<text x="483.0" y="1487.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">与预训练特征合并</text>
