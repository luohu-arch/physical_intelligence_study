<text x="698.0" y="506.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">RGB 图像 [H,W,3]</text>
<rect x="451" y="923" width="159" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="451" y1="929" x2="451" y2="1021" stroke="#0b57d0" stroke-width="3"/>
