<line x1="530" y1="409" x2="530" y2="501" stroke="#0969da" stroke-width="3"/>
<text x="634.0" y="459.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">RGB 图像 [H,W,3]</text>
<rect x="403" y="824" width="159" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="403" y1="830" x2="403" y2="922" stroke="#0b57d0" stroke-width="3"/>
<text x="482.5" y="880.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Fusion 方式</text>
<rect x="46" y="150" width="266" height="138" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="156" x2="46" y2="282" stroke="#0969da" stroke-width="3"/>
