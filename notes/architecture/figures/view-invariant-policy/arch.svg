<rect x="392" y="168" width="264" height="155" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="392" y1="174" x2="392" y2="317" stroke="#0969da" stroke-width="3"/>
<text x="524.0" y="217.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">图像与 Plucker map 联合</text>
<text x="524.0" y="238.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">随机裁剪</text>
<text x="524.0" y="267.0" font-size="12.5" fill="#57606a" text-anchor="middle">(相同空间裁剪, 防背景泄露相机位</text>
<text x="524.0" y="284.5" font-size="12.5" fill="#57606a" text-anchor="middle">姿)</text>
<rect x="269" y="1149" width="218" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="269" y1="1155" x2="269" y2="1248" stroke="#1a7f37" stroke-width="3"/>
<text x="378.0" y="1194.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">channel-wise 拼接</text>
<text x="378.0" y="1215.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">成 [H,W,9] 输入</text>
<rect x="556" y="1149" width="230" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="556" y1="1155" x2="556" y2="1248" stroke="#1a7f37" stroke-width="3"/>
<text x="671.0" y="1194.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">late fusion 小 CNN</text>
<text x="671.0" y="1215.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(不污染预训练权重)</text>
<rect x="432" y="1376" width="192" height="104" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="432" y1="1382" x2="432" y2="1474" stroke="#57606a" stroke-width="3"/>
