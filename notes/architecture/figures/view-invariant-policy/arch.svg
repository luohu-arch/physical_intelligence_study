<text x="185.0" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(AprilTags / 标定 / 元</text>
<text x="185.0" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">数据)</text>
<rect x="255" y="432" width="264" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="255" y1="438" x2="255" y2="581" stroke="#0b57d0" stroke-width="3"/>
<text x="387.0" y="481.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Plucker Ray 编码</text>
<text x="387.0" y="502.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">d = R*K^-1*[u,v,1]^T</text>
<text x="387.0" y="531.0" font-size="12.5" fill="#57606a" text-anchor="middle">m = t x d; 每像素 6 维:</text>
<text x="387.0" y="548.5" font-size="12.5" fill="#57606a" text-anchor="middle">方向 + 矩, 对相机位姿等变</text>
<rect x="405" y="697" width="241" height="104" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="405" y1="703" x2="405" y2="795" stroke="#0969da" stroke-width="3"/>
