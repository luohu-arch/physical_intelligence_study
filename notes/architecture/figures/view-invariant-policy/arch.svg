<rect x="430" y="1603" width="198" height="104" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="430" y1="1609" x2="430" y2="1701" stroke="#1a7f37" stroke-width="3"/>
