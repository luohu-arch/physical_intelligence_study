<svg xmlns="http://www.w3.org/2000/svg" width="997" height="2153" viewBox="26 112 997 2153" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>view-invariant-policy</title>
<rect x="26" y="112" width="997" height="2153" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">view-invariant-policy</text>
<text x="1001" y="142" font-size="12" fill="#57606a" text-anchor="end">当相机被移动或重新定位后，现有模仿学习策略大概率失效。这篇论文提出将策略条件化到相机外参（用 Plücker ray 编码每个像素的 3D 射线），使策略天然对相机视角鲁棒，在</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
