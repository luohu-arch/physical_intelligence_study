<svg xmlns="http://www.w3.org/2000/svg" width="1986" height="1851" viewBox="26 112 1986 1851" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>univla-latent-actions</title>
<rect x="26" y="112" width="1986" height="1851" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">univla-latent-actions</text>
<text x="1990" y="142" font-size="12" fill="#57606a" text-anchor="end">UniVLA 在 DINOv2 特征空间中学习与具体机器人无关的任务中心潜在动作表示，通过双阶段 VQ-VAE 分离任务相关/无关动态，仅用 OpenVLA 1/20 预训练算</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
