<rect x="330" y="150" width="264" height="155" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="330" y1="156" x2="330" y2="299" stroke="#0969da" stroke-width="3"/>
<text x="462.0" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">互联网视频 + 机器人演示</text>
<text x="462.0" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">+ Ego4D</text>
<text x="462.0" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">多 embodiment, 无动作标注也</text>
<text x="462.0" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">可用</text>
<rect x="789" y="386" width="269" height="172" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="789" y1="392" x2="789" y2="552" stroke="#57606a" stroke-width="3"/>
<text x="923.5" y="442.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Stage1: 任务无关</text>
<text x="923.5" y="460.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">潜在动作 a_TI</text>
<text x="923.5" y="480.5" font-size="11.5" fill="#57606a" text-anchor="middle">光照/视角等环境动态 + 语言</text>
<text x="923.5" y="495.5" font-size="11.5" fill="#57606a" text-anchor="middle">conditioning; codebook 约束</text>
<text x="923.5" y="510.5" font-size="11.5" fill="#57606a" text-anchor="middle">自动把任务语义挤出去</text>
<rect x="789" y="622" width="269" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="789" y1="628" x2="789" y2="771" stroke="#0b57d0" stroke-width="3"/>
<text x="923.5" y="677.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Stage 2: 任务中心潜在动</text>
<text x="923.5" y="695.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">作 a_TC</text>
<text x="923.5" y="715.5" font-size="11.5" fill="#57606a" text-anchor="middle">(冻结 Stage 1, 新增 codebook)</text>
<text x="923.5" y="730.5" font-size="11.5" fill="#57606a" text-anchor="middle">物体被抓起/移动等语义动态</text>
<rect x="1540" y="150" width="261" height="155" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="1540" y1="156" x2="1540" y2="299" stroke="#8a5a00" stroke-width="3"/>
<text x="1670.5" y="205.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L_TI / L_TC:</text>
<text x="1670.5" y="223.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">DINOv2 特征空间重建</text>
<text x="1670.5" y="243.5" font-size="11.5" fill="#57606a" text-anchor="middle">MSE</text>
<text x="1670.5" y="258.5" font-size="11.5" fill="#57606a" text-anchor="middle">(非像素, 避开纹理光照噪声)</text>
<rect x="793" y="858" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="793" y1="864" x2="793" y2="990" stroke="#0b57d0" stroke-width="3"/>
<text x="923.5" y="912.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">任务中心潜在动作 a_z</text>
<text x="923.5" y="930.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">4 个离散 token, 与本体</text>
<text x="923.5" y="950.5" font-size="11.5" fill="#57606a" text-anchor="middle">无关</text>
<rect x="46" y="167" width="246" height="104" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="173" x2="46" y2="265" stroke="#0969da" stroke-width="3"/>
<text x="169.0" y="223.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">机器人观测 + 语言指令</text>
<rect x="792" y="1094" width="264" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="792" y1="1100" x2="792" y2="1226" stroke="#1a7f37" stroke-width="3"/>
<text x="924.0" y="1148.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">通用 VLA 策略:</text>
<text x="924.0" y="1166.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Prismatic-7B</text>
<text x="924.0" y="1186.5" font-size="11.5" fill="#57606a" text-anchor="middle">(跨 embodiment 共享)</text>
<rect x="1232" y="166" width="270" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="1232" y1="172" x2="1232" y2="265" stroke="#8a5a00" stroke-width="3"/>
<text x="1367.0" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L_pretrain:</text>
<text x="1367.0" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">潜在动作自回归负对数似然</text>
<rect x="632" y="150" width="267" height="138" rx="6" fill="#fdf3f8" stroke="#d0d7de" stroke-width="1"/>
<line x1="632" y1="156" x2="632" y2="282" stroke="#bf3989" stroke-width="3"/>
<text x="765.5" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">上一步 4 个潜在动作</text>
<text x="765.5" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">token</text>
<text x="765.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">注入 prompt (CoT 式上下文)</text>
<rect x="792" y="1330" width="264" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="792" y1="1336" x2="792" y2="1462" stroke="#1a7f37" stroke-width="3"/>
<text x="924.0" y="1384.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">轻量动作解码器 10.8M</text>
<text x="924.0" y="1402.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">每个 embodiment 独立 (</text>
<text x="924.0" y="1422.5" font-size="11.5" fill="#57606a" text-anchor="middle">+ LoRA 约 123M)</text>
<rect x="937" y="166" width="257" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="937" y1="172" x2="937" y2="265" stroke="#8a5a00" stroke-width="3"/>
<text x="1065.5" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">下游损失: 潜在动作 NLL</text>
<text x="1065.5" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">+ 低层动作 L1 回归</text>
<rect x="793" y="1566" width="261" height="155" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="793" y1="1572" x2="793" y2="1715" stroke="#8250df" stroke-width="3"/>
<text x="923.5" y="1621.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">各机器人动作</text>
<text x="923.5" y="1639.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">LIBERO 95.2% vs</text>
<text x="923.5" y="1659.5" font-size="11.5" fill="#57606a" text-anchor="middle">OpenVLA 76.5%</text>
<text x="923.5" y="1674.5" font-size="11.5" fill="#57606a" text-anchor="middle">仅 1/20 预训练算力</text>
<text x="923.5" y="582.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">冻结后作基座</text>
<text x="923.8" y="1037.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">自回归预测的训练信号</text>
<text x="844.8" y="683.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">长程任务 +3.9 点</text>
<text x="1801" y="1759" font-size="10.5" fill="#8c959f" text-anchor="end">univla-latent-actions · arXiv 2505.06111 · v3 auto</text>
