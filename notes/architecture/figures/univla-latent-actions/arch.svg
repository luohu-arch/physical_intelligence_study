<text x="777" y="342" font-size="11.5" font-weight="600" fill="#57606a">潜在动作模型: 双阶段 VQ-VAE (DINOv2 特征空</text>
<text x="777" y="357" font-size="11.5" font-weight="600" fill="#57606a">间)</text>
