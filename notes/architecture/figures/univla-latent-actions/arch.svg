<rect x="370" y="168" width="264" height="155" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="370" y1="174" x2="370" y2="317" stroke="#0969da" stroke-width="3"/>
<text x="502.0" y="217.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">互联网视频 + 机器人演示</text>
<text x="502.0" y="238.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">+ Ego4D</text>
<text x="502.0" y="267.0" font-size="12.5" fill="#57606a" text-anchor="middle">多 embodiment, 无动作标注也</text>
<text x="502.0" y="284.5" font-size="12.5" fill="#57606a" text-anchor="middle">可用</text>
<rect x="884" y="432" width="269" height="172" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="884" y1="438" x2="884" y2="598" stroke="#57606a" stroke-width="3"/>
<text x="1018.5" y="480.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Stage1: 任务无关</text>
<text x="1018.5" y="501.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">潜在动作 a_TI</text>
<text x="1018.5" y="530.75" font-size="12.5" fill="#57606a" text-anchor="middle">光照/视角等环境动态 + 语言</text>
<text x="1018.5" y="548.25" font-size="12.5" fill="#57606a" text-anchor="middle">conditioning; codebook 约束</text>
<text x="1018.5" y="565.75" font-size="12.5" fill="#57606a" text-anchor="middle">自动把任务语义挤出去</text>
<rect x="884" y="697" width="269" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="884" y1="703" x2="884" y2="846" stroke="#0b57d0" stroke-width="3"/>
<text x="1018.5" y="746.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Stage 2: 任务中心潜在动</text>
<text x="1018.5" y="767.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">作 a_TC</text>
<text x="1018.5" y="796.0" font-size="12.5" fill="#57606a" text-anchor="middle">(冻结 Stage 1, 新增 codebook)</text>
<text x="1018.5" y="813.5" font-size="12.5" fill="#57606a" text-anchor="middle">物体被抓起/移动等语义动态</text>
<rect x="1725" y="168" width="261" height="155" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="1725" y1="174" x2="1725" y2="317" stroke="#8a5a00" stroke-width="3"/>
<text x="1855.5" y="217.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L_TI / L_TC:</text>
<text x="1855.5" y="238.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">DINOv2 特征空间重建</text>
<text x="1855.5" y="267.0" font-size="12.5" fill="#57606a" text-anchor="middle">MSE</text>
<text x="1855.5" y="284.5" font-size="12.5" fill="#57606a" text-anchor="middle">(非像素, 避开纹理光照噪声)</text>
<rect x="888" y="961" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="888" y1="967" x2="888" y2="1093" stroke="#0b57d0" stroke-width="3"/>
<text x="1018.5" y="1010.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">任务中心潜在动作 a_z</text>
<text x="1018.5" y="1031.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">4 个离散 token, 与本体</text>
<text x="1018.5" y="1060.25" font-size="12.5" fill="#57606a" text-anchor="middle">无关</text>
<rect x="52" y="187" width="246" height="104" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="193" x2="52" y2="285" stroke="#0969da" stroke-width="3"/>
<text x="175.0" y="242.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">机器人观测 + 语言指令</text>
<rect x="887" y="1225" width="264" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="887" y1="1231" x2="887" y2="1357" stroke="#1a7f37" stroke-width="3"/>
<text x="1019.0" y="1274.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">通用 VLA 策略:</text>
<text x="1019.0" y="1295.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Prismatic-7B</text>
<text x="1019.0" y="1324.25" font-size="12.5" fill="#57606a" text-anchor="middle">(跨 embodiment 共享)</text>
<rect x="1380" y="186" width="270" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="1380" y1="192" x2="1380" y2="285" stroke="#8a5a00" stroke-width="3"/>
<text x="1515.0" y="231.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L_pretrain:</text>
<text x="1515.0" y="252.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">潜在动作自回归负对数似然</text>
<rect x="708" y="168" width="267" height="138" rx="6" fill="#fdf3f8" stroke="#d0d7de" stroke-width="1"/>
<line x1="708" y1="174" x2="708" y2="300" stroke="#bf3989" stroke-width="3"/>
<text x="841.5" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">上一步 4 个潜在动作</text>
<text x="841.5" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">token</text>
<text x="841.5" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">注入 prompt (CoT 式上下文)</text>
<rect x="887" y="1490" width="264" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="887" y1="1496" x2="887" y2="1622" stroke="#1a7f37" stroke-width="3"/>
<text x="1019.0" y="1539.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">轻量动作解码器 10.8M</text>
<text x="1019.0" y="1560.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">每个 embodiment 独立 (</text>
<text x="1019.0" y="1589.25" font-size="12.5" fill="#57606a" text-anchor="middle">+ LoRA 约 123M)</text>
<rect x="1049" y="186" width="257" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="1049" y1="192" x2="1049" y2="285" stroke="#8a5a00" stroke-width="3"/>
<text x="1177.5" y="231.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">下游损失: 潜在动作 NLL</text>
<text x="1177.5" y="252.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">+ 低层动作 L1 回归</text>
<rect x="888" y="1754" width="261" height="155" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="888" y1="1760" x2="888" y2="1903" stroke="#8250df" stroke-width="3"/>
<text x="1018.5" y="1803.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">各机器人动作</text>
<text x="1018.5" y="1824.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">LIBERO 95.2% vs</text>
<text x="1018.5" y="1853.0" font-size="12.5" fill="#57606a" text-anchor="middle">OpenVLA 76.5%</text>
<text x="1018.5" y="1870.5" font-size="12.5" fill="#57606a" text-anchor="middle">仅 1/20 预训练算力</text>
<text x="1018.5" y="642.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">冻结后作基座</text>
<text x="1018.8" y="1154.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">自回归预测的训练信号</text>
<text x="930.2" y="757.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">长程任务 +3.9 点</text>
