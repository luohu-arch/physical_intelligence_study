<svg xmlns="http://www.w3.org/2000/svg" width="828" height="1554" viewBox="24 98 828 1554" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>diffusion-policy</title>
<rect x="24" y="98" width="828" height="1554" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">diffusion-policy</text>
<text x="830" y="128" font-size="12" fill="#57606a" text-anchor="end">把机器人策略写成条件 DDPM：以视觉观测 $O_t$ 为条件，从高斯噪声出发迭代去噪出一段长度为 $T_p$ 的动作序列，配合 receding horizon contro</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arw-thick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arw-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b57d0"/></marker>
<marker id="arw-loss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<rect x="226" y="322" width="369" height="1102" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="240" y="342" font-size="11.5" font-weight="600" fill="#57606a">条件去噪循环 (训练 100 步, DDIM 推理 10-16</text>
<text x="240" y="357" font-size="11.5" font-weight="600" fill="#57606a">步)</text>
