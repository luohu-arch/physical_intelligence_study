<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1726" viewBox="26 112 898 1726" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>diffusion-policy</title>
<rect x="26" y="112" width="898" height="1726" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">diffusion-policy</text>
<text x="902" y="142" font-size="12" fill="#57606a" text-anchor="end">把机器人策略写成条件 DDPM：以视觉观测 $O_t$ 为条件，从高斯噪声出发迭代去噪出一段长度为 $T_p$ 的动作序列，配合 receding horizon contro</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arw-thick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arw-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
