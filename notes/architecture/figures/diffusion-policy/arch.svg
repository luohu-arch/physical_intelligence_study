<line x1="301" y1="174" x2="301" y2="300" stroke="#0969da" stroke-width="3"/>
<text x="431.5" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">观测 O_t</text>
<text x="431.5" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">最近 T_o 帧多视角 RGB </text>
<text x="431.5" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">+低维状态</text>
<rect x="348" y="432" width="254" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
