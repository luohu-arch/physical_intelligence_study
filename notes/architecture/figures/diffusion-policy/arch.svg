<path d="M 699.0 288.0 L 699.0 545.0 L 438.5 545.0 L 438.5 622.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
<rect x="269" y="150" width="261" height="138" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="269" y1="156" x2="269" y2="282" stroke="#0969da" stroke-width="3"/>
<text x="399.5" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">观测 O_t</text>
<text x="399.5" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">最近 T_o 帧多视角 RGB </text>
<text x="399.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">+低维状态</text>
<rect x="311" y="386" width="254" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="311" y1="392" x2="311" y2="518" stroke="#1a7f37" stroke-width="3"/>
<text x="438.0" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">视觉编码器 ResNet-18</text>
<text x="438.0" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">只编码一次, 全部去噪步</text>
<text x="438.0" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">共享</text>
<rect x="46" y="166" width="185" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="172" x2="46" y2="265" stroke="#0969da" stroke-width="3"/>
<text x="138.5" y="213.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">初始噪声 A_t^K</text>
<text x="138.5" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">~ N(0, I)</text>
<rect x="308" y="622" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="308" y1="628" x2="308" y2="754" stroke="#0b57d0" stroke-width="3"/>
<text x="438.5" y="676.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">噪声预测网络 eps_theta</text>
<text x="438.5" y="694.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(O_t, A_t^k, k)</text>
<text x="438.5" y="714.5" font-size="11.5" fill="#57606a" text-anchor="middle">CNN + FiLM 或 Transformer</text>
<rect x="308" y="858" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="308" y1="864" x2="308" y2="990" stroke="#1a7f37" stroke-width="3"/>
<text x="438.5" y="912.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">去噪一步</text>
<text x="438.5" y="930.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">alpha*(A - gamma*eps)</text>
<text x="438.5" y="950.5" font-size="11.5" fill="#57606a" text-anchor="middle">+ noise</text>
<rect x="363" y="1094" width="150" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="363" y1="1100" x2="363" y2="1192" stroke="#0b57d0" stroke-width="3"/>
<text x="438.0" y="1150.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">KCHK</text>
<rect x="252" y="1296" width="150" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="252" y1="1302" x2="252" y2="1394" stroke="#0b57d0" stroke-width="3"/>
<text x="327.0" y="1352.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">0</text>
<rect x="440" y="1296" width="185" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="440" y1="1302" x2="440" y2="1395" stroke="#8250df" stroke-width="3"/>
<text x="532.5" y="1343.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">去噪结果 A_t^0</text>
<text x="532.5" y="1361.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">T_p 步动作序列</text>
<rect x="312" y="1499" width="253" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="312" y1="1505" x2="312" y2="1598" stroke="#8250df" stroke-width="3"/>
<text x="438.5" y="1546.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行 T_a 步</text>
<text x="438.5" y="1564.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">10Hz 预测插值到 125Hz</text>
<rect x="568" y="150" width="262" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="568" y1="156" x2="568" y2="282" stroke="#8a5a00" stroke-width="3"/>
<text x="699.0" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L: 去噪 MSE</text>
<text x="699.0" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(eps 预测 vs 真噪声,</text>
<text x="699.0" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">cosine 调度)</text>
<text x="436.3" y="971.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否, k 递减</text>
<text x="485.2" y="1239.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">是</text>
<text x="485.5" y="1442.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">receding horizon 只执行前 T_a 步</text>
<text x="406.8" y="938.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">新观测, 重新规划</text>
