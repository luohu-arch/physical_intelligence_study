<path d="M 438.0 1198.0 L 327.0 1296.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 438.0 524.0 L 438.5 622.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arw-main)"/>
