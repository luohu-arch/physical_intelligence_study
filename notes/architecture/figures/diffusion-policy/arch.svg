<text x="475.0" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">只编码一次, 全部去噪步</text>
<text x="475.0" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">共享</text>
<rect x="52" y="186" width="185" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="192" x2="52" y2="285" stroke="#0969da" stroke-width="3"/>
<text x="144.5" y="231.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">初始噪声 A_t^K</text>
<text x="144.5" y="252.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">~ N(0, I)</text>
<rect x="345" y="697" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="345" y1="703" x2="345" y2="829" stroke="#0b57d0" stroke-width="3"/>
<text x="475.5" y="746.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">噪声预测网络 eps_theta</text>
<text x="475.5" y="767.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(O_t, A_t^k, k)</text>
<text x="475.5" y="796.25" font-size="12.5" fill="#57606a" text-anchor="middle">CNN + FiLM 或 Transformer</text>
<rect x="345" y="961" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="345" y1="967" x2="345" y2="1093" stroke="#1a7f37" stroke-width="3"/>
<text x="475.5" y="1010.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">去噪一步</text>
<text x="475.5" y="1031.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">alpha*(A - gamma*eps)</text>
<text x="475.5" y="1060.25" font-size="12.5" fill="#57606a" text-anchor="middle">+ noise</text>
<rect x="407" y="1225" width="150" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="407" y1="1231" x2="407" y2="1323" stroke="#0b57d0" stroke-width="3"/>
<text x="482.0" y="1280.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">KCHK</text>
<rect x="282" y="1452" width="150" height="104" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="282" y1="1458" x2="282" y2="1550" stroke="#0b57d0" stroke-width="3"/>
<text x="357.0" y="1507.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">0</text>
<rect x="493" y="1452" width="185" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="493" y1="1458" x2="493" y2="1551" stroke="#8250df" stroke-width="3"/>
<text x="585.5" y="1497.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">去噪结果 A_t^0</text>
<text x="585.5" y="1518.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">T_p 步动作序列</text>
<rect x="349" y="1679" width="253" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="349" y1="1685" x2="349" y2="1778" stroke="#8250df" stroke-width="3"/>
<text x="475.5" y="1724.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行 T_a 步</text>
<text x="475.5" y="1745.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">10Hz 预测插值到 125Hz</text>
<rect x="636" y="168" width="262" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="636" y1="174" x2="636" y2="300" stroke="#8a5a00" stroke-width="3"/>
<text x="767.0" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">损失 L: 去噪 MSE</text>
<text x="767.0" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(eps 预测 vs 真噪声,</text>
<text x="767.0" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">cosine 调度)</text>
<text x="476.8" y="1074.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否, k 递减</text>
<text x="533.8" y="1382.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">是</text>
<text x="530.5" y="1610.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">receding horizon 只执行前 T_a 步</text>
<text x="441.2" y="1037.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">新观测, 重新规划</text>
