<svg xmlns="http://www.w3.org/2000/svg" width="991" height="2024" viewBox="26 112 991 2024" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>chunking-exploratory</title>
<rect x="26" y="112" width="991" height="2024" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">chunking-exploratory</text>
<text x="995" y="142" font-size="12" fill="#57606a" text-anchor="end">Problem**：连续控制 IL 存在指数复合误差下界（Simchowitz et al. 2025：即使动力学与专家均稳定，任何平滑马尔可夫学习器都逃不掉 C^T 放大）；</text>
