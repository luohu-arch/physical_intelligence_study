<rect x="386" y="168" width="269" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="386" y1="174" x2="386" y2="300" stroke="#57606a" stroke-width="3"/>
<text x="520.5" y="217.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">动力学 f 是否开环 EISS?</text>
<text x="520.5" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(如 EE 位置控制 + 高频底</text>
<text x="520.5" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">层跟踪)</text>
<rect x="52" y="450" width="267" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="456" x2="52" y2="549" stroke="#0b57d0" stroke-width="3"/>
<text x="185.5" y="495.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Practice 1: 动作</text>
<text x="185.5" y="516.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">chunking</text>
<rect x="393" y="450" width="262" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="393" y1="456" x2="393" y2="549" stroke="#0b57d0" stroke-width="3"/>
<text x="524.0" y="495.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Practice 2: 噪声注入</text>
<text x="524.0" y="516.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">采集</text>
<rect x="224" y="697" width="264" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="224" y1="703" x2="224" y2="796" stroke="#1a7f37" stroke-width="3"/>
<text x="356.0" y="742.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">开环执行长度 l 的动作块</text>
<text x="356.0" y="763.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">每 l 步才重观测一次</text>
<rect x="249" y="924" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="249" y1="930" x2="249" y2="1056" stroke="#1a7f37" stroke-width="3"/>
<text x="379.5" y="973.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">块长只需对数级</text>
<text x="379.5" y="994.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">l &gt; log(1/rho)^-1 *</text>
<text x="379.5" y="1023.25" font-size="12.5" fill="#57606a" text-anchor="middle">log poly(L_pi, C_ISS)</text>
<rect x="249" y="1188" width="251" height="105" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="249" y1="1194" x2="249" y2="1287" stroke="#57606a" stroke-width="3"/>
<text x="374.5" y="1233.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">诱导出闭环 EISS</text>
<text x="374.5" y="1254.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(C_tilde, rho^(1/2))</text>
<rect x="246" y="1416" width="266" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="246" y1="1422" x2="246" y2="1548" stroke="#0b57d0" stroke-width="3"/>
<text x="379.0" y="1465.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">J_TRAJ &lt;= O(1) *</text>
<text x="379.0" y="1486.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">J_DEMO</text>
<text x="379.0" y="1515.25" font-size="12.5" fill="#57606a" text-anchor="middle">horizon-free 误差界 (Thm 1)</text>
<rect x="562" y="697" width="258" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="562" y1="703" x2="562" y2="796" stroke="#1a7f37" stroke-width="3"/>
<text x="691.0" y="742.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">执行 u* + sigma_u * z</text>
<text x="691.0" y="763.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">但记录干净标签 u*</text>
<rect x="584" y="943" width="216" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="584" y1="949" x2="584" y2="1042" stroke="#0969da" stroke-width="3"/>
<text x="692.0" y="988.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">与干净专家轨迹混合</text>
<text x="692.0" y="1009.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(gamma = 0.5)</text>
<rect x="572" y="1188" width="226" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="572" y1="1194" x2="572" y2="1287" stroke="#0969da" stroke-width="3"/>
<text x="685.0" y="1233.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">等向白噪声激励</text>
<text x="685.0" y="1254.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">可控性 Gramian W_u</text>
<rect x="587" y="1434" width="216" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="587" y1="1440" x2="587" y2="1533" stroke="#0969da" stroke-width="3"/>
<text x="695.0" y="1479.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">大特征方向 =</text>
<text x="695.0" y="1500.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">误差复合最快的方向</text>
<rect x="391" y="1680" width="261" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="391" y1="1686" x2="391" y2="1812" stroke="#0b57d0" stroke-width="3"/>
<text x="521.5" y="1729.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">J_TRAJ &lt;= O*(T) *</text>
<text x="521.5" y="1750.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">J_DEMO</text>
<text x="521.5" y="1779.25" font-size="12.5" fill="#57606a" text-anchor="middle">混合分布上的界 (Thm 2)</text>
<rect x="388" y="1944" width="267" height="138" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="388" y1="1950" x2="388" y2="2076" stroke="#8250df" stroke-width="3"/>
<text x="521.5" y="1993.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">指数复合误差下界被绕开</text>
<text x="521.5" y="2014.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">单次采集即可, 无需</text>
<text x="521.5" y="2043.25" font-size="12.5" fill="#57606a" text-anchor="middle">DAgger 迭代</text>
<rect x="729" y="432" width="262" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="729" y1="438" x2="729" y2="564" stroke="#8a5a00" stroke-width="3"/>
<text x="860.0" y="481.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">块内发散</text>
<text x="860.0" y="502.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(开环不稳定:</text>
<text x="860.0" y="531.25" font-size="12.5" fill="#57606a" text-anchor="middle">HalfCheetah 反例)</text>
<text x="352.5" y="361.8" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">是</text>
<text x="522.2" y="370.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否</text>
<text x="692.0" y="361.0" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否却硬用朴素 chunking</text>
<text x="995" y="2124" font-size="10.5" fill="#8c959f" text-anchor="end">chunking-exploratory · arXiv 2507.09061 · v3 auto</text>
