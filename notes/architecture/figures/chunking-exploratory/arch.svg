<rect x="345" y="150" width="269" height="138" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="345" y1="156" x2="345" y2="282" stroke="#57606a" stroke-width="3"/>
<text x="479.5" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">动力学 f 是否开环 EISS?</text>
<text x="479.5" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(如 EE 位置控制 + 高频底</text>
<text x="479.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">层跟踪)</text>
<rect x="46" y="402" width="267" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="408" x2="46" y2="501" stroke="#0b57d0" stroke-width="3"/>
<text x="179.5" y="449.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Practice 1: 动作</text>
<text x="179.5" y="467.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">chunking</text>
<rect x="351" y="402" width="262" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="351" y1="408" x2="351" y2="501" stroke="#0b57d0" stroke-width="3"/>
<text x="482.0" y="449.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Practice 2: 噪声注入</text>
<text x="482.0" y="467.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">采集</text>
<rect x="200" y="622" width="264" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="200" y1="628" x2="200" y2="721" stroke="#1a7f37" stroke-width="3"/>
<text x="332.0" y="669.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">开环执行长度 l 的动作块</text>
<text x="332.0" y="687.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">每 l 步才重观测一次</text>
<rect x="222" y="825" width="261" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="222" y1="831" x2="222" y2="957" stroke="#1a7f37" stroke-width="3"/>
<text x="352.5" y="879.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">块长只需对数级</text>
<text x="352.5" y="897.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">l &gt; log(1/rho)^-1 *</text>
<text x="352.5" y="917.5" font-size="11.5" fill="#57606a" text-anchor="middle">log poly(L_pi, C_ISS)</text>
<rect x="222" y="1061" width="251" height="105" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<line x1="222" y1="1067" x2="222" y2="1160" stroke="#57606a" stroke-width="3"/>
<text x="347.5" y="1108.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">诱导出闭环 EISS</text>
<text x="347.5" y="1126.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(C_tilde, rho^(1/2))</text>
<rect x="220" y="1264" width="266" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="220" y1="1270" x2="220" y2="1396" stroke="#0b57d0" stroke-width="3"/>
<text x="353.0" y="1318.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">J_TRAJ &lt;= O(1) *</text>
<text x="353.0" y="1336.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">J_DEMO</text>
<text x="353.0" y="1356.5" font-size="11.5" fill="#57606a" text-anchor="middle">horizon-free 误差界 (Thm 1)</text>
<rect x="502" y="622" width="258" height="105" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="502" y1="628" x2="502" y2="721" stroke="#1a7f37" stroke-width="3"/>
<text x="631.0" y="669.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">执行 u* + sigma_u * z</text>
<text x="631.0" y="687.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">但记录干净标签 u*</text>
<rect x="521" y="842" width="216" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="521" y1="848" x2="521" y2="941" stroke="#0969da" stroke-width="3"/>
<text x="629.0" y="889.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">与干净专家轨迹混合</text>
<text x="629.0" y="907.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(gamma = 0.5)</text>
<rect x="511" y="1061" width="226" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="511" y1="1067" x2="511" y2="1160" stroke="#0969da" stroke-width="3"/>
<text x="624.0" y="1108.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">等向白噪声激励</text>
<text x="624.0" y="1126.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">可控性 Gramian W_u</text>
<rect x="524" y="1280" width="216" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="524" y1="1286" x2="524" y2="1379" stroke="#0969da" stroke-width="3"/>
<text x="632.0" y="1327.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">大特征方向 =</text>
<text x="632.0" y="1345.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">误差复合最快的方向</text>
<rect x="349" y="1500" width="261" height="138" rx="6" fill="#f0f4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="349" y1="1506" x2="349" y2="1632" stroke="#0b57d0" stroke-width="3"/>
<text x="479.5" y="1554.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">J_TRAJ &lt;= O*(T) *</text>
<text x="479.5" y="1572.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">J_DEMO</text>
<text x="479.5" y="1592.5" font-size="11.5" fill="#57606a" text-anchor="middle">混合分布上的界 (Thm 2)</text>
<rect x="346" y="1736" width="267" height="138" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="346" y1="1742" x2="346" y2="1868" stroke="#8250df" stroke-width="3"/>
<text x="479.5" y="1790.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">指数复合误差下界被绕开</text>
<text x="479.5" y="1808.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">单次采集即可, 无需</text>
<text x="479.5" y="1828.5" font-size="11.5" fill="#57606a" text-anchor="middle">DAgger 迭代</text>
<rect x="651" y="386" width="262" height="138" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="651" y1="392" x2="651" y2="518" stroke="#8a5a00" stroke-width="3"/>
<text x="782.0" y="440.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">块内发散</text>
<text x="782.0" y="458.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(开环不稳定:</text>
<text x="782.0" y="478.5" font-size="11.5" fill="#57606a" text-anchor="middle">HalfCheetah 反例)</text>
<text x="329.0" y="328.8" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">是</text>
<text x="480.8" y="337.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否</text>
<text x="632.5" y="329.0" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否却硬用朴素 chunking</text>
<text x="913" y="1912" font-size="10.5" fill="#8c959f" text-anchor="end">chunking-exploratory · arXiv 2507.09061 · v3 auto</text>
</svg>
