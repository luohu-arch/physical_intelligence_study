<text x="1240" y="128" font-size="12" fill="#57606a" text-anchor="end">Octo 是开源社区最成熟的扩散策略 VLA 模型，在 Open X-Embodiment 数据上预训练，采用 Transformer 骨干加扩散输出头实现连续动作生成，以极小</text>
