<line x1="234" y1="156" x2="234" y2="282" stroke="#0969da" stroke-width="3"/>
<text x="364.5" y="204.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">完全掩码的动作序列</text>
<text x="364.5" y="222.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">K x D token (K=5, D=7</text>
<text x="364.5" y="242.5" font-size="11.5" fill="#57606a" text-anchor="middle">)</text>
<rect x="410" y="622" width="262" height="155" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="410" y1="628" x2="410" y2="771" stroke="#0b57d0" stroke-width="3"/>
<text x="541.0" y="677.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">LSC 局部特殊 token 分类</text>
<text x="541.0" y="695.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">仅在 32 个动作 bin</text>
<text x="541.0" y="715.5" font-size="11.5" fill="#57606a" text-anchor="middle">token 上分类</text>
<text x="541.0" y="730.5" font-size="11.5" fill="#57606a" text-anchor="middle">不在约 32k 全词表</text>
