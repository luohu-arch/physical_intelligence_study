<text x="541.0" y="441.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">LLaDA-V 预训练扩散 VLM</text>
<text x="541.0" y="459.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">掩码扩散, 非自回归并行</text>
<text x="541.0" y="479.5" font-size="11.5" fill="#57606a" text-anchor="middle">生成</text>
<text x="541.0" y="494.5" font-size="11.5" fill="#57606a" text-anchor="middle">+ SigLIP-2 视觉编码</text>
