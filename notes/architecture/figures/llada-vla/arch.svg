<text x="392.5" y="238.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">K x D token (K=5, D=7</text>
<text x="392.5" y="267.25" font-size="12.5" fill="#57606a" text-anchor="middle">)</text>
