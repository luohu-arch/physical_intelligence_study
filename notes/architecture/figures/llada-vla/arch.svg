<text x="541.5" y="912.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">HAD 层次化动作解码</text>
<text x="541.5" y="930.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">动作级置信度排序 remask</text>
<text x="541.5" y="950.5" font-size="11.5" fill="#57606a" text-anchor="middle">+ 选中动作内 token 级精炼</text>
