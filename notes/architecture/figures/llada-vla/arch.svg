<text x="590.0" y="502.0" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">掩码扩散, 非自回归并行</text>
<text x="590.0" y="531.0" font-size="12.5" fill="#57606a" text-anchor="middle">生成</text>
