<text x="905.0" y="231.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">L_token 只算动作 token</text>
<rect x="407" y="1094" width="269" height="138" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="407" y1="1100" x2="407" y2="1226" stroke="#8250df" stroke-width="3"/>
<text x="541.5" y="1148.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">动作序列</text>
<text x="541.5" y="1166.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">delta 动作, 固定长度无</text>
<text x="541.5" y="1186.5" font-size="11.5" fill="#57606a" text-anchor="middle">EOS</text>
<rect x="466" y="1330" width="150" height="104" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
