<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="1384" viewBox="24 98 1035 1384" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>llada-vla</title>
<rect x="24" y="98" width="1035" height="1384" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">llada-vla</text>
<text x="1037" y="128" font-size="12" fill="#57606a" text-anchor="end">LLaDA-VLA 是首个基于预训练扩散 VLM（扩散 VLM）而非自回归 VLM 构建的 VLA 模型，通过局部特殊 token 分类（LSC）将连续动作映射为 32 个离散</text>
