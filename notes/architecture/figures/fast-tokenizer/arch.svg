<svg xmlns="http://www.w3.org/2000/svg" width="557" height="1758" viewBox="24 98 557 1758" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>fast-tokenizer</title>
<rect x="24" y="98" width="557" height="1758" fill="#ffffff"/>
<text x="46" y="128" font-size="14" font-weight="700" fill="#1f2328">fast-tokenizer</text>
<text x="559" y="128" font-size="12" fill="#57606a" text-anchor="end">FAST Tokenizer 通过离散余弦变换（DCT）将机器人动作轨迹从时域压缩到频域，保留前 10% 的低频系数即可覆盖 95% 以上能量，将序列长度缩短 80%，从根本上</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arw-thick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arw-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b57d0"/></marker>
<marker id="arw-loss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<rect x="146" y="306" width="313" height="648" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="160" y="326" font-size="11.5" font-weight="600" fill="#57606a">FAST 频域压缩 (核心 token 化)</text>
<path d="M 156.5 255.0 L 302.5 353.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 302.5 458.0 L 302.5 556.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arw-main)"/>
<path d="M 302.5 694.0 L 302.5 792.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arw-main)"/>
<path d="M 302.5 964.0 L 303.0 1028.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 432.0 255.0 L 432.0 731.5 L 303.0 731.5 L 303.0 1028.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
<path d="M 303.0 1166.0 L 302.5 1264.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 302.5 1402.0 L 303.0 1500.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 303.0 1605.0 L 302.5 1703.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 249.1 1808.0 L 249.1 1031.5 L 178.6 1031.5 L 178.6 255.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
<rect x="46" y="150" width="221" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="46" y1="156" x2="46" y2="249" stroke="#0969da" stroke-width="3"/>
<text x="156.5" y="197.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">时域动作序列 chunk</text>
<text x="156.5" y="215.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">长度 N = 50</text>
<rect x="215" y="353" width="175" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="215" y1="359" x2="215" y2="452" stroke="#0b57d0" stroke-width="3"/>
<text x="302.5" y="400.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">一维 DCT 变换</text>
<text x="302.5" y="418.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">时域 转 频域</text>
<rect x="172" y="556" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="172" y1="562" x2="172" y2="688" stroke="#0b57d0" stroke-width="3"/>
<text x="302.5" y="610.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">截断高频系数</text>
<text x="302.5" y="628.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">保留前 M = 10 个低频 (</text>
<text x="302.5" y="648.5" font-size="11.5" fill="#57606a" text-anchor="middle">95% 以上能量)</text>
<rect x="172" y="792" width="261" height="172" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="172" y1="798" x2="172" y2="958" stroke="#0b57d0" stroke-width="3"/>
<text x="302.5" y="848.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">BPE 量化建库</text>
<text x="302.5" y="866.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">词表 1024, 压成密集</text>
<text x="302.5" y="886.5" font-size="11.5" fill="#57606a" text-anchor="middle">token</text>
<text x="302.5" y="901.5" font-size="11.5" fill="#57606a" text-anchor="middle">(FAST+: 1M 真机轨迹训通用</text>
<text x="302.5" y="916.5" font-size="11.5" fill="#57606a" text-anchor="middle">tokenizer)</text>
<rect x="172" y="1028" width="262" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="172" y1="1034" x2="172" y2="1160" stroke="#1a7f37" stroke-width="3"/>
<text x="303.0" y="1082.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Transformer 自回归骨干</text>
<text x="303.0" y="1100.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(pi0-FAST, next-token</text>
<text x="303.0" y="1120.5" font-size="11.5" fill="#57606a" text-anchor="middle">预测)</text>
<rect x="305" y="150" width="254" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="305" y1="156" x2="305" y2="249" stroke="#8a5a00" stroke-width="3"/>
<text x="432.0" y="197.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">损失: next-token 交</text>
<text x="432.0" y="215.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">叉熵</text>
<rect x="169" y="1264" width="267" height="138" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="169" y1="1270" x2="169" y2="1396" stroke="#8250df" stroke-width="3"/>
<text x="302.5" y="1318.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">自回归生成频域 token</text>
<text x="302.5" y="1336.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(每 chunk 约 30-60</text>
<text x="302.5" y="1356.5" font-size="11.5" fill="#57606a" text-anchor="middle">token)</text>
<rect x="222" y="1500" width="162" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="222" y1="1506" x2="222" y2="1599" stroke="#8250df" stroke-width="3"/>
<text x="303.0" y="1547.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">逆 DCT 还原</text>
<text x="303.0" y="1565.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">高频部分补零</text>
<rect x="169" y="1703" width="267" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="169" y1="1709" x2="169" y2="1802" stroke="#8250df" stroke-width="3"/>
<text x="302.5" y="1750.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行 1 秒动作</text>
<text x="302.5" y="1768.5" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">chunk</text>
<text x="213.8" y="1023.5" font-size="11.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">执行后重观测 (与 pi0 相同执…</text>
<text x="559" y="1846" font-size="10.5" fill="#8c959f" text-anchor="end">fast-tokenizer · arXiv 2501.09747 · v3 auto</text>
</svg>
