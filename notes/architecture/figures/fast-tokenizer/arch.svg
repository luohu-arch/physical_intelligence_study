<svg xmlns="http://www.w3.org/2000/svg" width="596" height="1954" viewBox="26 112 596 1954" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" role="img">
<title>fast-tokenizer</title>
<rect x="26" y="112" width="596" height="1954" fill="#ffffff"/>
<text x="48" y="142" font-size="14" font-weight="700" fill="#1f2328">fast-tokenizer</text>
<text x="600" y="142" font-size="12" fill="#57606a" text-anchor="end">FAST Tokenizer 通过离散余弦变换（DCT）将机器人动作轨迹从时域压缩到频域，保留前 10% 的低频系数即可覆盖 95% 以上能量，将序列长度缩短 80%，从根本上</text>
<defs>
<marker id="arw-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="arw-thick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arw-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b57d0"/></marker>
<marker id="arw-loss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs>
<rect x="164" y="343" width="313" height="648" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="178" y="363" font-size="11.5" font-weight="600" fill="#57606a">FAST 频域压缩 (核心 token 化)</text>
<path d="M 162.5 273.0 L 328.5 395.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 328.5 500.0 L 323.5 623.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arw-main)"/>
<path d="M 323.5 761.0 L 323.5 887.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arw-main)"/>
<path d="M 323.5 1059.0 L 324.0 1151.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 469.0 273.0 L 469.0 802.0 L 324.0 802.0 L 324.0 1151.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
<path d="M 324.0 1289.0 L 322.5 1416.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 322.5 1554.0 L 330.0 1680.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 330.0 1785.0 L 322.5 1907.0" fill="none" stroke="#1f2328" stroke-width="2.0" marker-end="url(#arw-thick)"/>
<path d="M 269.1 2012.0 L 269.1 1142.5 L 184.6 1142.5 L 184.6 273.0" fill="none" stroke="#0b57d0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw-fb)"/>
<rect x="52" y="168" width="221" height="105" rx="6" fill="#f0f6fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="174" x2="52" y2="267" stroke="#0969da" stroke-width="3"/>
<text x="162.5" y="213.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">时域动作序列 chunk</text>
<text x="162.5" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">长度 N = 50</text>
<rect x="241" y="395" width="175" height="105" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="241" y1="401" x2="241" y2="494" stroke="#0b57d0" stroke-width="3"/>
<text x="328.5" y="440.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">一维 DCT 变换</text>
<text x="328.5" y="461.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">时域 转 频域</text>
<rect x="193" y="623" width="261" height="138" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="193" y1="629" x2="193" y2="755" stroke="#0b57d0" stroke-width="3"/>
<text x="323.5" y="672.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">截断高频系数</text>
<text x="323.5" y="693.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">保留前 M = 10 个低频 (</text>
<text x="323.5" y="722.25" font-size="12.5" fill="#57606a" text-anchor="middle">95% 以上能量)</text>
<rect x="193" y="887" width="261" height="172" rx="6" fill="#eef4fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="193" y1="893" x2="193" y2="1053" stroke="#0b57d0" stroke-width="3"/>
<text x="323.5" y="935.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">BPE 量化建库</text>
<text x="323.5" y="956.75" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">词表 1024, 压成密集</text>
<text x="323.5" y="985.75" font-size="12.5" fill="#57606a" text-anchor="middle">token</text>
<text x="323.5" y="1003.25" font-size="12.5" fill="#57606a" text-anchor="middle">(FAST+: 1M 真机轨迹训通用</text>
<text x="323.5" y="1020.75" font-size="12.5" fill="#57606a" text-anchor="middle">tokenizer)</text>
<rect x="193" y="1151" width="262" height="138" rx="6" fill="#f2f9f3" stroke="#d0d7de" stroke-width="1"/>
<line x1="193" y1="1157" x2="193" y2="1283" stroke="#1a7f37" stroke-width="3"/>
<text x="324.0" y="1200.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">Transformer 自回归骨干</text>
<text x="324.0" y="1221.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(pi0-FAST, next-token</text>
<text x="324.0" y="1250.25" font-size="12.5" fill="#57606a" text-anchor="middle">预测)</text>
<rect x="342" y="168" width="254" height="105" rx="6" fill="#fdf8ec" stroke="#d0d7de" stroke-width="1"/>
<line x1="342" y1="174" x2="342" y2="267" stroke="#8a5a00" stroke-width="3"/>
<text x="469.0" y="213.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">损失: next-token 交</text>
<text x="469.0" y="234.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">叉熵</text>
<rect x="189" y="1416" width="267" height="138" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="189" y1="1422" x2="189" y2="1548" stroke="#8250df" stroke-width="3"/>
<text x="322.5" y="1465.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">自回归生成频域 token</text>
<text x="322.5" y="1486.25" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">(每 chunk 约 30-60</text>
<text x="322.5" y="1515.25" font-size="12.5" fill="#57606a" text-anchor="middle">token)</text>
<rect x="249" y="1680" width="162" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="249" y1="1686" x2="249" y2="1779" stroke="#8250df" stroke-width="3"/>
<text x="330.0" y="1725.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">逆 DCT 还原</text>
<text x="330.0" y="1746.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">高频部分补零</text>
<rect x="189" y="1907" width="267" height="105" rx="6" fill="#f8f5fe" stroke="#d0d7de" stroke-width="1"/>
<line x1="189" y1="1913" x2="189" y2="2006" stroke="#8250df" stroke-width="3"/>
<text x="322.5" y="1952.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">机器人执行 1 秒动作</text>
<text x="322.5" y="1973.5" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle">chunk</text>
<text x="226.9" y="1134.5" font-size="12.5" fill="#57606a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">执行后重观测 (与 pi0 相同执…</text>
<text x="600" y="2054" font-size="10.5" fill="#8c959f" text-anchor="end">fast-tokenizer · arXiv 2501.09747 · v3 auto</text>
</svg>
