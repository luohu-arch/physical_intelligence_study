<text x="797" y="142" font-size="12" fill="#57606a" text-anchor="end">FAST-LIO2 提出了一种快速、鲁棒的 LiDAR-inertial 里程计框架。相比传统方法提取特征点再配准，它直接将原始点云注册到地图上（direct method），</text>
